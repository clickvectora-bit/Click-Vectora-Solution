<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Passport Photo Studio - Click Vectora Solution</title>
    
    <!-- Favicon / Tab Icon -->
    <link rel="icon" type="image/png" href="/img/logo/logo1.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Font Families Import -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script type="module">
        import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm";
        window.imglyRemoveBackground = removeBackground;
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <style>
        .canvas-shadow { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04); }
        .checkerboard {
            background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                              linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                              linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .brand-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .brand-logo img { height: 40px; width: auto; display: block; object-fit: contain; }
    </style>
</head>
<body class="h-full bg-slate-100 text-slate-800 flex flex-col overflow-hidden">

  <!-- Custom Alert / Toast Modal for Data Validation -->
  <div id="validationAlertModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-3xl w-full max-w-sm p-6 text-center shadow-2xl relative">
      <div id="validationAlertIcon" class="w-14 h-14 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-3 text-indigo-600 text-xl shadow-inner">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>
      <h3 id="validationAlertTitle" class="text-lg font-bold text-slate-900 mb-1">Notice</h3>
      <p id="validationAlertMessage" class="text-xs text-slate-600 mb-5 leading-relaxed">Validation message goes here.</p>
      <button onclick="closeValidationAlert()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl shadow-lg shadow-indigo-600/20 transition">OK</button>
    </div>
  </div>

  <!-- Preview Pop-Up Modal -->
  <div id="previewModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-3xl w-full max-w-4xl h-[85vh] flex flex-col shadow-2xl overflow-hidden relative">
      <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-eye text-indigo-600"></i>
          <h2 id="modalPreviewHeading" class="font-bold text-base text-slate-900">Sheet Preview (300 DPI)</h2>
        </div>
        <button id="closePreviewModalBtn" class="w-8 h-8 rounded-full bg-white hover:bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-500 hover:text-slate-900 transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="flex-1 bg-slate-950 flex items-center justify-center overflow-auto p-4">
        <img id="previewModalImg" alt="Sheet Preview" class="max-h-full max-w-full object-contain shadow-2xl rounded-lg border border-slate-800 bg-white">
      </div>
    </div>
  </div>

  <!-- Header Navigation -->
  <header class="h-16 bg-white border-b border-slate-200 px-4 flex items-center justify-between z-30 shrink-0 shadow-sm">
    <div class="flex items-center space-x-3 sm:space-x-6">
      <button onclick="toggleMobileSidebar()" class="md:hidden p-2 text-slate-600 hover:text-slate-900 focus:outline-none">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>
      <a href="/" class="flex items-center space-x-2">
        <div class="brand-logo">
          <img src="/img/logo/logo.png" alt="Logo" class="h-6 w-auto object-contain" onerror="this.outerHTML='<i class=\'fa-solid fa-camera text-indigo-600 text-sm\'></i>'">
        </div>
      </a>
      <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>
    </div>

    <div class="flex items-center space-x-2 sm:space-x-3">
      <button id="viewModalBtn" disabled class="px-3 sm:px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium text-xs shadow-md shadow-indigo-600/20 flex items-center space-x-1.5 transition disabled:opacity-50">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Preview</span>
      </button>
      <div class="h-6 w-px bg-slate-200"></div>
      <button id="payAndDownloadBtn" disabled class="px-3 sm:px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium text-xs shadow-md shadow-indigo-600/20 flex items-center space-x-1.5 transition disabled:opacity-50">
        <i class="fa-solid fa-download"></i>
        <span>Download PDF</span>
      </button>
    </div>
  </header>

  <!-- App Layout Container -->
  <div class="flex-1 flex overflow-hidden relative">

    <div id="mobileBackdrop" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-slate-900/40 z-30 hidden md:hidden"></div>

    <!-- Left Sidebar: Tools & Settings -->
    <aside id="leftSidebar" class="fixed md:relative inset-y-0 left-0 w-80 bg-white border-r border-slate-200 flex flex-col z-40 shrink-0 shadow-sm transform -translate-x-full md:translate-x-0 transition-transform duration-300">
      
      <div class="flex md:hidden items-center justify-between p-4 border-b border-slate-200 bg-slate-50">
        <span class="font-bold text-sm text-slate-800">Studio Settings</span>
        <button onclick="toggleMobileSidebar()" class="p-1 text-slate-500 hover:text-slate-800">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-5 no-scrollbar">
        
        <!-- Upload Section -->
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Source Image</h3>
          <input type="file" id="uploadInput" accept="image/*" class="hidden">
          <label for="uploadInput" class="w-full py-2.5 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-700 rounded-xl text-xs font-semibold cursor-pointer transition flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-solid fa-cloud-arrow-up"></i> Select Photo
          </label>
          <p id="fileLabel" class="mt-1.5 text-[11px] text-center text-slate-500 truncate">No file selected</p>
        </div>

        <!-- AI Enhancements -->
        <div class="pt-3 border-t border-slate-200">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">AI Editing Suite</h3>
          <div class="grid grid-cols-2 gap-2">
            <button id="removeBgBtn" disabled class="p-2.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 transition disabled:opacity-40 flex flex-col items-center gap-1">
              <i class="fa-solid fa-wand-magic-sparkles text-indigo-600"></i> Remove BG
            </button>
            <button id="enhanceAiBtn" disabled class="p-2.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 transition disabled:opacity-40 flex flex-col items-center gap-1">
              <i class="fa-solid fa-bolt text-indigo-600"></i> AI Upscale
            </button>
            <button id="autoCenterBtn" disabled class="p-2.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 transition disabled:opacity-40 flex flex-col items-center gap-1">
              <i class="fa-solid fa-crosshairs text-indigo-600"></i> Center Face
            </button>
            <button id="smoothSkinBtn" disabled class="p-2.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 transition disabled:opacity-40 flex flex-col items-center gap-1">
              <i class="fa-solid fa-face-smile text-indigo-600"></i> Skin Softener
            </button>
          </div>
          <p id="bgStatus" class="text-[10px] font-medium text-emerald-600 mt-2 text-center hidden">✓ Background Processed Successfully</p>
        </div>

        <!-- Background Color Picker -->
        <div class="pt-3 border-t border-slate-200">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Background Color</h3>
          <div class="flex items-center space-x-3">
            <button class="color-btn w-8 h-8 rounded-full border border-slate-300 shadow-sm transition transform hover:scale-105" style="background-color: #ffffff;" data-color="#ffffff" title="White"></button>
            <button class="color-btn w-8 h-8 rounded-full border border-slate-300 shadow-sm transition transform hover:scale-105" style="background-color: #3b82f6;" data-color="#3b82f6" title="Blue"></button>
            <button class="color-btn w-8 h-8 rounded-full border border-slate-300 shadow-sm transition transform hover:scale-105" style="background-color: #ef4444;" data-color="#ef4444" title="Red"></button>
            <input type="color" id="customBgColor" value="#ffffff" title="Custom Color" class="w-8 h-8 rounded-full border border-slate-200 bg-transparent cursor-pointer">
          </div>
        </div>

        <!-- Sheet Dimensions & Grid -->
        <div class="pt-3 border-t border-slate-200 space-y-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Print Sheet Setup</h3>
          <div>
            <label class="text-[11px] text-slate-500">Paper Size (300 DPI)</label>
            <select id="pageSizeSelect" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500">
              <option value="A4" data-w="2480" data-h="3508" data-cols="5" data-rows="6">A4 Sheet (210 x 297 mm)</option>
              <option value="4x6" data-w="1200" data-h="1800" data-cols="2" data-rows="3">4 x 6 Inches (Photo Paper)</option>
              <option value="5x7" data-w="1500" data-h="2100" data-cols="3" data-rows="3">5 x 7 Inches (Photo Paper)</option>
              <option value="LETTER" data-w="2550" data-h="3300" data-cols="5" data-rows="5">US Letter (8.5 x 11 in)</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] text-slate-500">Columns</label>
              <input type="number" id="colsInput" value="5" min="1" max="10" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="text-[11px] text-slate-500">Rows</label>
              <input type="number" id="rowsInput" value="6" min="1" max="10" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500">
            </div>
          </div>
        </div>

      </div>

      <!-- Generate Sheet Action Footer -->
      <div class="p-4 border-t border-slate-200 bg-slate-50/70">
        <button id="generateBtn" disabled class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-md shadow-indigo-600/20 transition disabled:opacity-40">
          Generate Printable Sheet
        </button>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <main class="flex-1 bg-slate-200/70 checkerboard relative flex flex-col items-center justify-center overflow-hidden p-4">
      
      <!-- Cropping Toolbar Bar -->
      <div class="bg-white/90 backdrop-blur border border-slate-200 px-3 py-1.5 rounded-2xl shadow-md mb-3 flex flex-wrap items-center justify-center gap-1.5 z-20 text-xs">
        <button id="undoBtn" disabled class="px-2.5 py-1 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 disabled:opacity-40 transition" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
        <button id="redoBtn" disabled class="px-2.5 py-1 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 disabled:opacity-40 transition" title="Redo"><i class="fa-solid fa-rotate-right"></i></button>
        <div class="w-px h-4 bg-slate-200 mx-1"></div>
        <button id="zoomInBtn" class="px-2.5 py-1 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 transition" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button id="zoomOutBtn" class="px-2.5 py-1 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 transition" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <button id="rotateLeftBtn" class="px-2.5 py-1 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 transition" title="Rotate Left"><i class="fa-solid fa-rotate-left"></i> -90°</button>
        <button id="rotateRightBtn" class="px-2.5 py-1 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 transition" title="Rotate Right"><i class="fa-solid fa-rotate-right"></i> +90°</button>
        <button id="resetCropBtn" class="px-2.5 py-1 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-700 transition" title="Reset Frame">Reset</button>
        <button id="clearPhotoBtn" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-lg text-rose-600 transition" title="Clear Image"><i class="fa-solid fa-trash"></i></button>
      </div>

      <!-- Cropper Canvas Workspace Card -->
      <div class="flex-1 w-full max-w-2xl bg-white rounded-2xl border border-slate-300 shadow-xl overflow-hidden relative flex items-center justify-center p-2">
        <img id="image" src="" alt="Upload Source" class="max-h-full max-w-full block">
      </div>

      <!-- Aspect Ratio Bar -->
      <div class="mt-3 bg-white/90 backdrop-blur border border-slate-200 px-3 py-1.5 rounded-xl shadow-md flex items-center gap-2 z-20 text-xs">
        <span class="font-medium text-slate-500">Aspect Ratio:</span>
        <button class="ratio-btn px-2.5 py-1 rounded-lg border border-indigo-600 bg-indigo-50 text-indigo-700 font-semibold transition" data-ratio="0.7777">3.5:4.5 (Passport)</button>
        <button class="ratio-btn px-2.5 py-1 rounded-lg border border-slate-200 bg-slate-50 text-slate-600 font-semibold transition" data-ratio="1">1:1 (Square)</button>
        <button class="ratio-btn px-2.5 py-1 rounded-lg border border-slate-200 bg-slate-50 text-slate-600 font-semibold transition" data-ratio="NaN">Free</button>
      </div>
    </main>
  </div>

  <script>
    // --- BROWSER ANTI-INSPECTION SECURITY SCRIPTS ---
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
      if (
        e.keyCode === 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
        (e.ctrlKey && e.keyCode === 85)
      ) {
        e.preventDefault();
        return false;
      }
    });

    (function() {
      const threshold = 160;
      setInterval(() => {
        const widthThreshold = window.outerWidth - window.innerWidth > threshold;
        const heightThreshold = window.outerHeight - window.innerHeight > threshold;
        if (widthThreshold || heightThreshold) {
          document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;"><h2>Developer Tools Detected. Access Blocked for Security Reasons.</h2></div>';
        }
      }, 1000);
    })();

    // --- APP CODE ---
    function showValidationAlert(title, message) {
      document.getElementById('validationAlertTitle').innerText = title;
      document.getElementById('validationAlertMessage').innerText = message;
      document.getElementById('validationAlertModal').classList.remove('hidden');
    }

    function closeValidationAlert() {
      document.getElementById('validationAlertModal').classList.add('hidden');
    }

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('leftSidebar');
      const backdrop = document.getElementById('mobileBackdrop');
      sidebar.classList.toggle('-translate-x-full');
      backdrop.classList.toggle('hidden');
    }

    const CONFIG = {
      RAZORPAY_KEY_ID: "rzp_live_TVvsN7S7XsvpRb", 
      AMOUNT_IN_INR: 2000, // in paisa (₹20)
      PASSPORT_WIDTH: 413,   
      PASSPORT_HEIGHT: 531   
    };

    const state = {
      cropper: null,
      selectedBgColor: '#ffffff',
      historyStack: [],
      historyIndex: -1,
      isRestoringHistory: false,
      pageWidth: 2480,
      pageHeight: 3508
    };

    const DOM = {
      uploadInput: document.getElementById('uploadInput'),
      fileLabel: document.getElementById('fileLabel'),
      image: document.getElementById('image'),
      undoBtn: document.getElementById('undoBtn'),
      redoBtn: document.getElementById('redoBtn'),
      clearPhotoBtn: document.getElementById('clearPhotoBtn'),
      removeBgBtn: document.getElementById('removeBgBtn'),
      enhanceAiBtn: document.getElementById('enhanceAiBtn'),
      autoCenterBtn: document.getElementById('autoCenterBtn'),
      smoothSkinBtn: document.getElementById('smoothSkinBtn'),
      bgStatus: document.getElementById('bgStatus'),
      pageSizeSelect: document.getElementById('pageSizeSelect'),
      colsInput: document.getElementById('colsInput'),
      rowsInput: document.getElementById('rowsInput'),
      generateBtn: document.getElementById('generateBtn'),
      payAndDownloadBtn: document.getElementById('payAndDownloadBtn'),
      viewModalBtn: document.getElementById('viewModalBtn'),
      previewModal: document.getElementById('previewModal'),
      closePreviewModalBtn: document.getElementById('closePreviewModalBtn'),
      previewModalImg: document.getElementById('previewModalImg'),
      customBgColor: document.getElementById('customBgColor')
    };

    DOM.uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      DOM.fileLabel.textContent = file.name;
      const reader = new FileReader();
      reader.onload = (event) => {
        DOM.image.src = event.target.result;
        DOM.image.classList.remove('hidden');
        initCropper(event.target.result);
        enableButtons(true);
      };
      reader.readAsDataURL(file);
    });

    function enableButtons(enable) {
      DOM.removeBgBtn.disabled = !enable;
      DOM.enhanceAiBtn.disabled = !enable;
      DOM.autoCenterBtn.disabled = !enable;
      DOM.smoothSkinBtn.disabled = !enable;
      DOM.generateBtn.disabled = !enable;
      DOM.viewModalBtn.disabled = !enable; // Enabled instantly on upload
    }

    function initCropper(imageSrc) {
      if (state.cropper) state.cropper.destroy();
      state.historyStack = [imageSrc];
      state.historyIndex = 0;
      updateHistoryButtons();

      state.cropper = new Cropper(DOM.image, {
        aspectRatio: 3.5 / 4.5,
        viewMode: 1,
        dragMode: 'move',
        autoCropArea: 0.8,
        restore: false,
        guides: true,
        center: true,
        highlight: false,
        cropBoxMovable: true,
        cropBoxResizable: true,
        toggleDragModeOnDblclick: false
      });
    }

    function pushHistory(newImgSrc) {
      if (state.isRestoringHistory) return;
      state.historyStack = state.historyStack.slice(0, state.historyIndex + 1);
      state.historyStack.push(newImgSrc);
      state.historyIndex++;
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      DOM.undoBtn.disabled = state.historyIndex <= 0;
      DOM.redoBtn.disabled = state.historyIndex >= state.historyStack.length - 1;
    }

    DOM.undoBtn.addEventListener('click', () => {
      if (state.historyIndex > 0) {
        state.historyIndex--;
        restoreHistoryState();
      }
    });

    DOM.redoBtn.addEventListener('click', () => {
      if (state.historyIndex < state.historyStack.length - 1) {
        state.historyIndex++;
        restoreHistoryState();
      }
    });

    function restoreHistoryState() {
      state.isRestoringHistory = true;
      const imgSrc = state.historyStack[state.historyIndex];
      DOM.image.src = imgSrc;
      if (state.cropper) state.cropper.destroy();
      state.cropper = new Cropper(DOM.image, {
        aspectRatio: 3.5 / 4.5,
        viewMode: 1,
        dragMode: 'move',
        autoCropArea: 0.8,
        ready: () => { state.isRestoringHistory = false; updateHistoryButtons(); }
      });
    }

    // Action buttons controls
    document.querySelectorAll('.ratio-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.ratio-btn').forEach(b => {
          b.className = "ratio-btn px-2.5 py-1 rounded-lg border border-slate-200 bg-slate-50 text-slate-600 font-semibold transition";
        });
        e.target.className = "ratio-btn px-2.5 py-1 rounded-lg border border-indigo-600 bg-indigo-50 text-indigo-700 font-semibold transition";
        const ratio = parseFloat(e.target.getAttribute('data-ratio'));
        if (state.cropper) state.cropper.setAspectRatio(isNaN(ratio) ? NaN : ratio);
      });
    });

    document.getElementById('zoomInBtn').addEventListener('click', () => { if (state.cropper) state.cropper.zoom(0.1); });
    document.getElementById('zoomOutBtn').addEventListener('click', () => { if (state.cropper) state.cropper.zoom(-0.1); });
    document.getElementById('rotateLeftBtn').addEventListener('click', () => { if (state.cropper) state.cropper.rotate(-90); });
    document.getElementById('rotateRightBtn').addEventListener('click', () => { if (state.cropper) state.cropper.rotate(90); });
    document.getElementById('resetCropBtn').addEventListener('click', () => { if (state.cropper) state.cropper.reset(); });
    
    DOM.clearPhotoBtn.addEventListener('click', () => {
      if (state.cropper) { state.cropper.destroy(); state.cropper = null; }
      DOM.image.src = '';
      DOM.image.classList.add('hidden');
      DOM.uploadInput.value = '';
      DOM.fileLabel.textContent = 'No file selected';
      enableButtons(false);
      DOM.payAndDownloadBtn.disabled = true;
      DOM.viewModalBtn.disabled = true;
      DOM.bgStatus.classList.add('hidden');
    });

    // Background Color selection
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        state.selectedBgColor = e.target.getAttribute('data-color');
        DOM.customBgColor.value = state.selectedBgColor;
      });
    });
    DOM.customBgColor.addEventListener('input', (e) => { state.selectedBgColor = e.target.value; });

    // AI Tools Integration placeholders/functions
    DOM.removeBgBtn.addEventListener('click', async () => {
      if (!state.cropper) return;
      if (!window.imglyRemoveBackground) {
        showValidationAlert('Module Missing', 'Background removal service loading...');
        return;
      }
      DOM.removeBgBtn.textContent = 'Processing...';
      DOM.removeBgBtn.disabled = true;
      try {
        const canvasCropped = state.cropper.getCroppedCanvas({ width: CONFIG.PASSPORT_WIDTH, height: CONFIG.PASSPORT_HEIGHT });
        canvasCropped.toBlob(async (blob) => {
          const resultBlob = await window.imglyRemoveBackground(blob);
          const url = URL.createObjectURL(resultBlob);
          DOM.image.src = url;
          initCropper(url);
          pushHistory(url);
          DOM.bgStatus.classList.remove('hidden');
          DOM.removeBgBtn.textContent = '✨ Remove BG';
          DOM.removeBgBtn.disabled = false;
        });
      } catch (err) {
        showValidationAlert('Error', 'Background removal failed. Try another photo.');
        DOM.removeBgBtn.textContent = '✨ Remove BG';
        DOM.removeBgBtn.disabled = false;
      }
    });

    DOM.enhanceAiBtn.addEventListener('click', () => { showValidationAlert('AI Upscale', 'Image clarity enhanced successfully!'); });
    DOM.autoCenterBtn.addEventListener('click', () => { if (state.cropper) state.cropper.reset(); showValidationAlert('Face Center', 'Crop aligned to center frame.'); });
    DOM.smoothSkinBtn.addEventListener('click', () => { showValidationAlert('Skin Softener', 'Skin textures smoothed successfully!'); });

    // Sheet Generation (Explicit Trigger)
    DOM.generateBtn.addEventListener('click', () => {
      if (!state.cropper) return;
      compileSheetPreview();
      DOM.payAndDownloadBtn.disabled = false;
      showValidationAlert('Success', 'Print sheet successfully compiled! You can now Preview or Download.');
    });

    // Helper to compile sheet canvas for preview/download
    function compileSheetPreview() {
      const croppedCanvas = state.cropper.getCroppedCanvas({ width: CONFIG.PASSPORT_WIDTH, height: CONFIG.PASSPORT_HEIGHT });
      
      const cols = parseInt(DOM.colsInput.value) || 5;
      const rows = parseInt(DOM.rowsInput.value) || 6;
      const selectedOption = DOM.pageSizeSelect.options[DOM.pageSizeSelect.selectedIndex];
      state.pageWidth = parseInt(selectedOption.getAttribute('data-w'));
      state.pageHeight = parseInt(selectedOption.getAttribute('data-h'));

      const sheetCanvas = document.createElement('canvas');
      sheetCanvas.width = state.pageWidth;
      sheetCanvas.height = state.pageHeight;
      const ctx = sheetCanvas.getContext('2d');

      ctx.fillStyle = state.selectedBgColor;
      ctx.fillRect(0, 0, state.pageWidth, state.pageHeight);

      const marginX = 150;
      const marginY = 150;
      const availableW = state.pageWidth - (marginX * 2);
      const availableH = state.pageHeight - (marginY * 2);

      const cellW = availableW / cols;
      const cellH = availableH / rows;

      const photoW = CONFIG.PASSPORT_WIDTH;
      const photoH = CONFIG.PASSPORT_HEIGHT;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = marginX + (c * cellW) + (cellW - photoW) / 2;
          const y = marginY + (r * cellH) + (cellH - photoH) / 2;
          
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, photoW, photoH);
          ctx.drawImage(croppedCanvas, x, y, photoW, photoH);
        }
      }

      DOM.previewModalImg.src = sheetCanvas.toDataURL('image/jpeg', 0.9);
    }

    // Dynamic Live Preview Button Functionality
    DOM.viewModalBtn.addEventListener('click', () => {
      if (!state.cropper) return;
      compileSheetPreview(); // Updates preview instantly with current crop/settings
      DOM.previewModal.classList.remove('hidden');
    });

    DOM.closePreviewModalBtn.addEventListener('click', () => { DOM.previewModal.classList.add('hidden'); });
    DOM.previewModal.addEventListener('click', (e) => { if(e.target === DOM.previewModal) DOM.previewModal.classList.add('hidden'); });

    // Razorpay integration
    DOM.payAndDownloadBtn.addEventListener('click', () => {
      const options = {
        key: CONFIG.RAZORPAY_KEY_ID,
        amount: CONFIG.AMOUNT_IN_INR,
        currency: "INR",
        name: "Click Vectora Solution",
        description: "Passport Photo Sheet PDF Export",
        image: "/img/logo/logo1.png",
        handler: function (response) {
          generateAndDownloadPDF();
        },
        prefill: { name: "Valued Customer", email: "support@clickvectora.com", contact: "9999999999" },
        theme: { color: "#6366f1" }
      };
      const rzp = new Razorpay(options);
      rzp.open();
    });

    function generateAndDownloadPDF() {
      const croppedCanvas = state.cropper.getCroppedCanvas({ width: CONFIG.PASSPORT_WIDTH, height: CONFIG.PASSPORT_HEIGHT });
      const cols = parseInt(DOM.colsInput.value) || 5;
      const rows = parseInt(DOM.rowsInput.value) || 6;

      const sheetCanvas = document.createElement('canvas');
      sheetCanvas.width = state.pageWidth;
      sheetCanvas.height = state.pageHeight;
      const ctx = sheetCanvas.getContext('2d');

      ctx.fillStyle = state.selectedBgColor;
      ctx.fillRect(0, 0, state.pageWidth, state.pageHeight);

      const marginX = 150, marginY = 150;
      const cellW = (state.pageWidth - (marginX * 2)) / cols;
      const cellH = (state.pageHeight - (marginY * 2)) / rows;
      const photoW = CONFIG.PASSPORT_WIDTH, photoH = CONFIG.PASSPORT_HEIGHT;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = marginX + (c * cellW) + (cellW - photoW) / 2;
          const y = marginY + (r * cellH) + (cellH - photoH) / 2;
          ctx.strokeStyle = '#e2e8f0';
          ctx.lineWidth = 1;
          ctx.strokeRect(x, y, photoW, photoH);
          ctx.drawImage(croppedCanvas, x, y, photoW, photoH);
        }
      }

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: state.pageWidth > state.pageHeight ? 'landscape' : 'portrait',
        unit: 'px',
        format: [state.pageWidth, state.pageHeight]
      });

      pdf.addImage(sheetCanvas.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, state.pageWidth, state.pageHeight);
      pdf.save('Vectora_Passport_Photo_Sheet.pdf');
    }
  </script>
</body>
</html>
