<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Passport Photo Studio - Click Vectora Solution</title>
  
  <!-- Browser Tab Favicon Logo -->
  <link rel="icon" type="image/png" href="img/logo/logo1.png">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script type="module">
    import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm";
    window.imglyRemoveBackground = removeBackground;
  </script>

  <style>
    :root {
      --bg-main: #e2e8f0;
      --bg-surface: #ffffff;
      --bg-input: #f1f5f9;
      --primary: #ff6b00;
      --orange: #ff6b00;
      --cyan: #00a8cc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: rgba(15, 23, 42, 0.06);
      --shadow-hover: rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* Navigation Bar matching posterbanner.html */
    nav {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: 0.5rem 5%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 3px var(--shadow);
    }

    .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-logo img { height: 70px; width: auto; display: block; object-fit: contain; }

    .brand-title-center {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links { display: flex; gap: 2rem; align-items: center; list-style: none; justify-self: flex-end; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: color 0.3s; }
    .nav-links a:hover { color: var(--cyan); }

    .menu-toggle {
      display: none;
      background: transparent;
      border: none;
      font-size: 1.6rem;
      color: var(--text-main);
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      justify-self: flex-end;
    }

    .theme-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px var(--shadow);
    }

    .theme-card:hover {
      box-shadow: 0 8px 30px var(--shadow-hover);
    }

    .theme-input {
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .theme-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 168, 204, 0.15);
      outline: none;
    }

    .btn-cyan {
      background-color: var(--cyan);
      color: #ffffff;
    }
    .btn-cyan:hover {
      filter: brightness(0.92);
    }

    .btn-orange {
      background-color: var(--orange);
      color: #ffffff;
    }
    .btn-orange:hover {
      filter: brightness(0.92);
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
    }
    .btn-secondary:hover {
      background-color: #cbd5e1;
    }

    .text-muted {
      color: var(--text-muted);
    }

    .img-container {
      height: 520px;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
    }

    @media (max-width: 900px) {
      nav { display: flex; justify-content: space-between; padding: 0.4rem 5%; }
      .brand-title-center { display: none; }
      .brand-logo img { height: 50px; }
      .menu-toggle { display: block; }
      .nav-links {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: var(--bg-surface);
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-in-out;
        border-bottom: 1px solid var(--border);
        box-shadow: 0 10px 15px rgba(0,0,0,0.05);
      }
      .nav-links.active {
        max-height: 350px;
      }
      .nav-links li {
        width: 100%;
        border-bottom: 1px solid var(--border);
      }
      .nav-links a {
        display: block;
        padding: 1rem 1.5rem;
        width: 100%;
      }
    }
  </style>
</head>
<body class="min-h-screen relative">

  <!-- Centered Preview Pop-Up Modal (Floating Dialog) -->
  <div id="previewModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden justify-center items-center z-[99999] p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl flex flex-col max-w-4xl w-full max-h-[90vh] overflow-hidden p-6 animate-in fade-in zoom-in-95 duration-200">
      
      <!-- Pop-Up Header -->
      <div class="flex justify-between items-center pb-4 border-b border-slate-800">
        <h3 id="modalPreviewHeading" class="text-lg font-bold text-white">Sheet Preview Pop-Up</h3>
        <button id="closePreviewModalBtn" class="btn-secondary px-3 py-1.5 rounded-xl text-sm font-bold shadow transition hover:bg-slate-200">
          ✕ Close
        </button>
      </div>

      <!-- Pop-Up Body with Scrollable Image Container -->
      <div class="flex-1 overflow-auto flex justify-center items-center py-4">
        <img id="previewModalImg" alt="Sheet Preview" class="max-h-[70vh] max-w-full object-contain shadow-lg rounded-lg border border-slate-700 bg-white">
      </div>

      <!-- Pop-Up Footer Note -->
      <div class="pt-3 border-t border-slate-800 text-center text-xs text-slate-400">
        Click outside the pop-up box or use the close button to return.
      </div>
    </div>
  </div>

  <!-- Navigation Bar with Gradient Title matching posterbanner.html -->
  <nav>
    <a href="/" class="brand-logo">
      <img src="img/logo/logo.png" alt="Click Vectora Solution Logo" onerror="this.src='https://via.placeholder.com/200x80?text=Click+Vectora'">
    </a>
    <div class="brand-title-center">AI Passport Photo Studio</div>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/">Home</a></li>
      <li><a href="/#portfolio">Work</a></li>
      <li><a href="/#services">Design Services</a></li>
      <li><a href="/store">Online Store</a></li>
      <li><a href="/contact">Contact Us</a></li>
    </ul>
  </nav>

  <div class="max-w-6xl mx-auto theme-card rounded-2xl p-6 md:p-8 transition-all relative my-8">
  
    <main class="space-y-8">
      
      <section class="space-y-4">
        
        <div class="p-4 border-2 border-dashed rounded-xl text-center transition-all" style="border-color: var(--border); background-color: var(--bg-input);">
          <input type="file" id="uploadInput" accept="image/*" class="hidden">
          <label for="uploadInput" class="cursor-pointer btn-cyan px-6 py-2 rounded-lg font-semibold inline-block shadow-sm transition-transform active:scale-95 text-sm">
            Select Photo
          </label>
          <p id="fileLabel" class="mt-1 text-xs text-muted">No file selected</p>
        </div>

        <div class="space-y-3">
          <div class="flex justify-between items-center">
            <label class="block text-xs font-bold uppercase tracking-wider text-muted">Crop Workspace (Full Display)</label>
            <span id="bgStatus" class="text-xs font-medium text-teal-600 hidden">✓ Background Processed</span>
          </div>

          <div class="grid grid-cols-8 gap-1.5 md:gap-2">
            <button id="undoBtn" class="btn-secondary text-xs py-2 rounded-lg font-semibold disabled:opacity-40" disabled title="Undo Action">↩️ Undo</button>
            <button id="redoBtn" class="btn-secondary text-xs py-2 rounded-lg font-semibold disabled:opacity-40" disabled title="Redo Action">↪️ Redo</button>
            <button id="zoomInBtn" class="btn-secondary text-xs py-2 rounded-lg font-semibold" title="Zoom In">🔍 +</button>
            <button id="zoomOutBtn" class="btn-secondary text-xs py-2 rounded-lg font-semibold" title="Zoom Out">🔍 -</button>
            <button id="rotateLeftBtn" class="btn-secondary text-xs py-2 rounded-lg font-semibold" title="Rotate Left">🔄 -90°</button>
            <button id="rotateRightBtn" class="btn-secondary text-xs py-2 rounded-lg font-semibold" title="Rotate Right">🔄 +90°</button>
            <button id="resetCropBtn" class="btn-secondary text-xs py-2 rounded-lg font-semibold" title="Reset Frame">💥 Reset</button>
            <button id="clearPhotoBtn" class="bg-red-100 text-red-700 hover:bg-red-200 text-xs py-2 rounded-lg font-semibold transition" title="Clear Image">🗑️ Clear</button>
          </div>

          <div class="img-container rounded-xl overflow-hidden flex items-center justify-center w-full">
            <img id="image" src="" alt="Upload Source" class="hidden">
          </div>

          <div class="flex items-center gap-3 pt-1">
            <label class="text-xs font-semibold text-muted">Aspect Ratio:</label>
            <button class="ratio-btn text-xs px-3 py-1 rounded bg-slate-200 font-semibold" data-ratio="0.7777">3.5:4.5 (Passport)</button>
            <button class="ratio-btn text-xs px-3 py-1 rounded bg-slate-100 font-semibold" data-ratio="1">1:1 (Square)</button>
            <button class="ratio-btn text-xs px-3 py-1 rounded bg-slate-100 font-semibold" data-ratio="NaN">Free</button>
          </div>
        </div>

      </section>

      <section class="grid grid-cols-1 lg:grid-cols-2 gap-8 pt-6 border-t" style="border-color: var(--border);">
        
        <div class="space-y-6">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-3">AI Editing Suite</label>
            <div class="grid grid-cols-2 gap-3">
              <button id="removeBgBtn" class="btn-cyan text-sm py-2.5 px-3 rounded-lg font-medium transition shadow-sm disabled:opacity-50">
                ✨ Remove BG (AI)
              </button>
              <button id="enhanceAiBtn" class="btn-cyan text-sm py-2.5 px-3 rounded-lg font-medium transition shadow-sm disabled:opacity-50">
                🪄 AI Upscale
              </button>
              <button id="autoCenterBtn" class="btn-cyan text-sm py-2.5 px-3 rounded-lg font-medium transition shadow-sm disabled:opacity-50">
                🎯 Center Face
              </button>
              <button id="smoothSkinBtn" class="btn-cyan text-sm py-2.5 px-3 rounded-lg font-medium transition shadow-sm disabled:opacity-50">
                🧴 Skin Softener
              </button>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium mb-2">Background Color:</label>
            <div class="flex items-center gap-3">
              <button class="color-btn w-9 h-9 rounded-full border-2 transition-transform hover:scale-105" style="border-color: var(--border); background-color: #ffffff;" data-color="#ffffff" title="White"></button>
              <button class="color-btn w-9 h-9 rounded-full border-2 transition-transform hover:scale-105" style="border-color: var(--border); background-color: #3b82f6;" data-color="#3b82f6" title="Blue"></button>
              <button class="color-btn w-9 h-9 rounded-full border-2 transition-transform hover:scale-105" style="border-color: var(--border); background-color: #ef4444;" data-color="#ef4444" title="Red"></button>
              <input type="color" id="customBgColor" value="#ffffff" class="w-9 h-9 rounded-full cursor-pointer border-0 bg-transparent">
            </div>
          </div>

          <div class="space-y-4 pt-2 border-t" style="border-color: var(--border);">
            <div>
              <label class="block text-sm font-medium mb-1">Paper Size (300 DPI):</label>
              <select id="pageSizeSelect" class="w-full theme-input rounded-lg p-2.5 text-sm font-semibold">
                <option value="A4" data-w="2480" data-h="3508" data-cols="5" data-rows="6">A4 Sheet (210 x 297 mm)</option>
                <option value="4x6" data-w="1200" data-h="1800" data-cols="2" data-rows="3">4 x 6 Inches (Photo Paper)</option>
                <option value="5x7" data-w="1500" data-h="2100" data-cols="3" data-rows="3">5 x 7 Inches (Photo Paper)</option>
                <option value="LETTER" data-w="2550" data-h="3300" data-cols="5" data-rows="5">US Letter (8.5 x 11 in)</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">Columns:</label>
                <input type="number" id="colsInput" value="5" min="1" max="10" class="w-full theme-input rounded-lg p-2.5 text-sm">
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">Rows:</label>
                <input type="number" id="rowsInput" value="6" min="1" max="10" class="w-full theme-input rounded-lg p-2.5 text-sm">
              </div>
            </div>
          </div>

          <button id="generateBtn" class="w-full btn-orange py-3 rounded-xl font-bold text-base transition shadow-md hover:shadow-lg">
            Generate Printable Sheet
          </button>
        </div>

        <div class="flex flex-col items-center justify-start space-y-4">
          <div class="w-full flex justify-between items-center">
            <h2 id="previewHeading" class="text-lg font-bold">A4 Sheet Preview (300 DPI)</h2>
            <button id="viewModalBtn" class="btn-cyan text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1 shadow-sm disabled:opacity-50" disabled>
              🔍 Preview Pop-Up
            </button>
          </div>

          <div class="theme-input p-3 rounded-2xl w-full flex justify-center max-h-[460px] overflow-auto">
            <canvas id="a4Canvas" class="max-w-full h-auto bg-white rounded shadow-sm"></canvas>
          </div>
          
          <button id="payAndDownloadBtn" class="w-full btn-orange py-3.5 rounded-xl font-bold text-base transition shadow-md disabled:opacity-50" disabled>
            Pay ₹20 via Razorpay & Download PDF
          </button>
        </div>

      </section>

    </main>
  </div>

  <script>
    // Responsive Navbar Menu Toggle Script matching posterbanner.html
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');

    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
      const icon = menuToggle.querySelector('i');
      if (navLinks.classList.contains('active')) {
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-xmark');
      } else {
        icon.classList.remove('fa-xmark');
        icon.classList.add('fa-bars');
      }
    });

    const CONFIG = {
      RAZORPAY_KEY_ID: "rzp_live_TVvsN7S7XsvpRb", 
      AMOUNT_IN_INR: 20,
      PAYEE_NAME: "ClickVectora Solution",
      PASSPORT_WIDTH: 413,   // 35mm at 300 DPI
      PASSPORT_HEIGHT: 531   // 45mm at 300 DPI
    };

    const state = {
      cropper: null,
      selectedBgColor: '#ffffff',
      historyStack: [],
      historyIndex: -1,
      isRestoringHistory: false,
      pageWidth: 2480,
      pageHeight: 3508
    };

    const DOM = {
      uploadInput: document.getElementById('uploadInput'),
      fileLabel: document.getElementById('fileLabel'),
      image: document.getElementById('image'),
      
      undoBtn: document.getElementById('undoBtn'),
      redoBtn: document.getElementById('redoBtn'),
      clearPhotoBtn: document.getElementById('clearPhotoBtn'),
      removeBgBtn: document.getElementById('removeBgBtn'),
      enhanceAiBtn: document.getElementById('enhanceAiBtn'),
      autoCenterBtn: document.getElementById('autoCenterBtn'),
      smoothSkinBtn: document.getElementById('smoothSkinBtn'),
      bgStatus: document.getElementById('bgStatus'),

      pageSizeSelect: document.getElementById('pageSizeSelect'),
      colsInput: document.getElementById('colsInput'),
      rowsInput: document.getElementById('rowsInput'),
      generateBtn: document.getElementById('generateBtn'),
      payAndDownloadBtn: document.getElementById('payAndDownloadBtn'),
      customBgColor: document.getElementById('customBgColor'),
      previewHeading: document.getElementById('previewHeading'),
      canvas: document.getElementById('a4Canvas'),
      ctx: document.getElementById('a4Canvas').getContext('2d'),

      viewModalBtn: document.getElementById('viewModalBtn'),
      previewModal: document.getElementById('previewModal'),
      previewModalImg: document.getElementById('previewModalImg'),
      closePreviewModalBtn: document.getElementById('closePreviewModalBtn'),
      modalPreviewHeading: document.getElementById('modalPreviewHeading')
    };

    DOM.pageSizeSelect.addEventListener('change', (e) => {
      const option = e.target.options[e.target.selectedIndex];
      state.pageWidth = parseInt(option.getAttribute('data-w'));
      state.pageHeight = parseInt(option.getAttribute('data-h'));
      DOM.colsInput.value = option.getAttribute('data-cols');
      DOM.rowsInput.value = option.getAttribute('data-rows');
      
      const label = option.text.split('(')[0].trim();
      DOM.previewHeading.innerText = `${label} Sheet Preview (300 DPI)`;
      DOM.modalPreviewHeading.innerText = `${label} Sheet Preview (Pop-Up)`;
    });

    function pushHistory(dataUrl) {
      if (state.isRestoringHistory) return;
      if (state.historyIndex < state.historyStack.length - 1) {
        state.historyStack = state.historyStack.slice(0, state.historyIndex + 1);
      }
      state.historyStack.push(dataUrl);
      state.historyIndex = state.historyStack.length - 1;
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      DOM.undoBtn.disabled = state.historyIndex <= 0;
      DOM.redoBtn.disabled = state.historyIndex >= state.historyStack.length - 1;
    }

    function restoreHistoryState(index) {
      if (index < 0 || index >= state.historyStack.length) return;
      state.isRestoringHistory = true;
      state.historyIndex = index;
      
      state.cropper.replace(state.historyStack[index]);
      setTimeout(() => {
        state.isRestoringHistory = false;
        updateHistoryButtons();
      }, 200);
    }

    DOM.undoBtn.addEventListener('click', () => state.historyIndex > 0 && restoreHistoryState(state.historyIndex - 1));
    DOM.redoBtn.addEventListener('click', () => state.historyIndex < state.historyStack.length - 1 && restoreHistoryState(state.historyIndex + 1));

    DOM.uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      DOM.fileLabel.innerText = file.name;
      DOM.image.src = URL.createObjectURL(file);
      DOM.image.classList.remove('hidden');

      if (state.cropper) state.cropper.destroy();
      
      state.historyStack = [];
      state.historyIndex = -1;

      state.cropper = new Cropper(DOM.image, {
        aspectRatio: 3.5 / 4.5,
        viewMode: 1,
        autoCropArea: 0.9,
        dragMode: 'move',
        responsive: true,
        restore: false,
        checkCrossOrigin: false,
        ready() {
          const initialCanvas = state.cropper.getCroppedCanvas();
          if (initialCanvas) pushHistory(initialCanvas.toDataURL('image/png'));
        }
      });

      DOM.bgStatus.classList.add('hidden');
    });

    // Clear photo button functionality
    DOM.clearPhotoBtn.addEventListener('click', () => {
      if (state.cropper) {
        state.cropper.destroy();
        state.cropper = null;
      }
      DOM.image.src = '';
      DOM.image.classList.add('hidden');
      DOM.uploadInput.value = '';
      DOM.fileLabel.innerText = 'No file selected';
      DOM.bgStatus.classList.add('hidden');
      state.historyStack = [];
      state.historyIndex = -1;
      updateHistoryButtons();
    });

    document.getElementById('zoomInBtn').addEventListener('click', () => state.cropper && state.cropper.zoom(0.1));
    document.getElementById('zoomOutBtn').addEventListener('click', () => state.cropper && state.cropper.zoom(-0.1));
    document.getElementById('rotateLeftBtn').addEventListener('click', () => state.cropper && state.cropper.rotate(-90));
    document.getElementById('rotateRightBtn').addEventListener('click', () => state.cropper && state.cropper.rotate(90));
    document.getElementById('resetCropBtn').addEventListener('click', () => state.cropper && state.cropper.reset());

    document.querySelectorAll('.ratio-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (!state.cropper) return;
        document.querySelectorAll('.ratio-btn').forEach(b => b.classList.replace('bg-slate-200', 'bg-slate-100'));
        e.target.classList.replace('bg-slate-100', 'bg-slate-200');
        const ratio = parseFloat(e.target.getAttribute('data-ratio'));
        state.cropper.setAspectRatio(isNaN(ratio) ? NaN : ratio);
      });
    });

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        state.selectedBgColor = e.target.getAttribute('data-color');
        DOM.customBgColor.value = state.selectedBgColor;
      });
    });

    DOM.customBgColor.addEventListener('input', (e) => state.selectedBgColor = e.target.value);

    DOM.removeBgBtn.addEventListener('click', async () => {
      if (!state.cropper) return alert('Please upload a photo first!');

      DOM.removeBgBtn.innerText = 'Removing BG...';
      DOM.removeBgBtn.disabled = true;

      try {
        const croppedCanvas = state.cropper.getCroppedCanvas();
        const blob = await new Promise(resolve => croppedCanvas.toBlob(resolve, 'image/png'));
        
        if (window.imglyRemoveBackground) {
          const bgRemovedBlob = await window.imglyRemoveBackground(blob, {
            publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.4.5/dist/"
          });
          const newUrl = URL.createObjectURL(bgRemovedBlob);
          state.cropper.replace(newUrl);
          pushHistory(newUrl);
          DOM.bgStatus.classList.remove('hidden');
        } else {
          throw new Error("WASM Engine Unavailable");
        }
      } catch (err) {
        console.warn('Initiating Canvas Masking Fallback:', err);
        try {
          const canvas = state.cropper.getCroppedCanvas();
          const ctx = canvas.getContext('2d');
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;

          for (let i = 0; i < data.length; i += 4) {
            if (data[i] > 220 && data[i+1] > 220 && data[i+2] > 220) data[i + 3] = 0;
          }
          ctx.putImageData(imgData, 0, 0);
          const dataUrl = canvas.toDataURL('image/png');
          state.cropper.replace(dataUrl);
          pushHistory(dataUrl);
          DOM.bgStatus.classList.remove('hidden');
        } catch (fallbackErr) {
          alert('Background removal failed. Please run this app via a web server.');
        }
      } finally {
        DOM.removeBgBtn.innerText = '✨ Remove BG (AI)';
        DOM.removeBgBtn.disabled = false;
      }
    });

    DOM.enhanceAiBtn.addEventListener('click', () => {
      if (!state.cropper) return alert('Please upload a photo first!');
      const cCanvas = state.cropper.getCroppedCanvas({ width: 800, height: 1028 });
      const cCtx = cCanvas.getContext('2d');
      cCtx.filter = 'contrast(1.08) brightness(1.03) saturate(1.05)';
      cCtx.drawImage(cCanvas, 0, 0);
      const dataUrl = cCanvas.toDataURL('image/jpeg', 0.95);
      state.cropper.replace(dataUrl);
      pushHistory(dataUrl);
    });

    DOM.autoCenterBtn.addEventListener('click', () => {
      if (!state.cropper) return alert('Please upload a photo first!');
      state.cropper.reset();
      const containerData = state.cropper.getContainerData();
      state.cropper.setCropBoxData({
        left: (containerData.width - 200) / 2,
        top: 30,
        width: 200,
        height: 257
      });
    });

    DOM.smoothSkinBtn.addEventListener('click', () => {
      if (!state.cropper) return alert('Please upload a photo first!');
      const cCanvas = state.cropper.getCroppedCanvas();
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = cCanvas.width;
      tempCanvas.height = cCanvas.height;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.filter = 'blur(1px) brightness(1.02)';
      tCtx.drawImage(cCanvas, 0, 0);
      const dataUrl = tempCanvas.toDataURL('image/png');
      state.cropper.replace(dataUrl);
      pushHistory(dataUrl);
    });

    DOM.generateBtn.addEventListener('click', () => {
      if (!state.cropper) return alert('Please upload a photo first!');

      DOM.canvas.width = state.pageWidth;
      DOM.canvas.height = state.pageHeight;

      DOM.ctx.fillStyle = '#ffffff';
      DOM.ctx.fillRect(0, 0, state.pageWidth, state.pageHeight);

      const croppedCanvas = state.cropper.getCroppedCanvas({ 
        width: CONFIG.PASSPORT_WIDTH, 
        height: CONFIG.PASSPORT_HEIGHT 
      });

      const passportCanvas = document.createElement('canvas');
      passportCanvas.width = CONFIG.PASSPORT_WIDTH;
      passportCanvas.height = CONFIG.PASSPORT_HEIGHT;
      const pCtx = passportCanvas.getContext('2d');

      pCtx.fillStyle = state.selectedBgColor;
      pCtx.fillRect(0, 0, CONFIG.PASSPORT_WIDTH, CONFIG.PASSPORT_HEIGHT);
      pCtx.drawImage(croppedCanvas, 0, 0, CONFIG.PASSPORT_WIDTH, CONFIG.PASSPORT_HEIGHT);

      const cols = parseInt(DOM.colsInput.value) || 1;
      const rows = parseInt(DOM.rowsInput.value) || 1;
      const gapX = 40;
      const gapY = 40;

      const totalGridWidth = (cols * CONFIG.PASSPORT_WIDTH) + ((cols - 1) * gapX);
      const totalGridHeight = (rows * CONFIG.PASSPORT_HEIGHT) + ((rows - 1) * gapY);

      const startX = Math.max((state.pageWidth - totalGridWidth) / 2, 30);
      const startY = Math.max((state.pageHeight - totalGridHeight) / 2, 30);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const posX = startX + c * (CONFIG.PASSPORT_WIDTH + gapX);
          const posY = startY + r * (CONFIG.PASSPORT_HEIGHT + gapY);

          DOM.ctx.drawImage(passportCanvas, posX, posY, CONFIG.PASSPORT_WIDTH, CONFIG.PASSPORT_HEIGHT);
          DOM.ctx.strokeStyle = '#cccccc';
          DOM.ctx.lineWidth = 2;
          DOM.ctx.strokeRect(posX, posY, CONFIG.PASSPORT_WIDTH, CONFIG.PASSPORT_HEIGHT);
        }
      }

      DOM.payAndDownloadBtn.disabled = false;
      DOM.viewModalBtn.disabled = false;
    });

    // Pop-Up Modal Event Handlers
    DOM.viewModalBtn.addEventListener('click', () => {
      DOM.previewModalImg.src = DOM.canvas.toDataURL('image/jpeg', 0.95);
      DOM.previewModal.classList.remove('hidden');
      DOM.previewModal.classList.add('flex');
    });

    DOM.closePreviewModalBtn.addEventListener('click', () => {
      DOM.previewModal.classList.remove('flex');
      DOM.previewModal.classList.add('hidden');
    });

    DOM.previewModal.addEventListener('click', (e) => {
      if (e.target === DOM.previewModal) {
        DOM.previewModal.classList.remove('flex');
        DOM.previewModal.classList.add('hidden');
      }
    });

    function triggerPDFDownload() {
      const { jsPDF } = window.jspdf;
      const orientation = state.pageWidth > state.pageHeight ? 'l' : 'p';
      
      const pdf = new jsPDF({
        orientation: orientation,
        unit: 'px',
        format: [state.pageWidth, state.pageHeight]
      });

      const imgData = DOM.canvas.toDataURL('image/jpeg', 0.98);
      pdf.addImage(imgData, 'JPEG', 0, 0, state.pageWidth, state.pageHeight);
      pdf.save(`clickvectora-passport-sheet-${Date.now()}.pdf`);
    }

    DOM.payAndDownloadBtn.addEventListener('click', () => {
      if (DOM.canvas.width === 0) return alert("Please generate the sheet first!");

      if (typeof Razorpay === 'undefined') {
        alert("Razorpay SDK load nahi hua! Internet connection ya AdBlocker check karein.");
        return;
      }

      const options = {
        key: CONFIG.RAZORPAY_KEY_ID,
        amount: CONFIG.AMOUNT_IN_INR * 100, 
        currency: "INR",
        name: CONFIG.PAYEE_NAME,
        description: "High-Resolution Printable Passport PDF Sheet",
        image: "img/logo/logo1.png",
        handler: function (response) {
          if (response.razorpay_payment_id) {
            triggerPDFDownload();
          }
        },
        modal: {
          ondismiss: function() {
            console.log("Payment popup closed.");
          }
        },
        theme: {
          color: "#ff6b00"
        }
      };

      try {
        const rzp1 = new Razorpay(options);
        rzp1.open();
      } catch (err) {
        alert("Payment popup open karne me error aaya: " + err.message);
      }
    });
  </script>
</body>
</html>
