<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Vectora Studio - Business Card Generator</title>

  <!-- CDN Libraries: QR Code, Canvas, jsPDF & Razorpay -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    :root {
      --brand-cyan: #00a8b5;
      --brand-blue: #0077c8;
      --brand-orange: #f37021;
      --brand-dark: #2b2e34;
      --bg-light: #f4f8fa;
      --card-bg: #ffffff;
      --border-color: #d1e5e8;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg-light); margin: 0; padding: 20px; color: var(--brand-dark); }
    
    .brand-header {
      display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 25px;
    }
    .brand-header img { max-height: 65px; margin-bottom: 8px; }
    .brand-header h2 { margin: 0; color: var(--brand-dark); font-size: 22px; font-weight: 800; }
    .brand-header span { color: var(--brand-cyan); font-weight: 600; font-size: 13px; letter-spacing: 1px; }

    .wrapper { display: flex; gap: 24px; justify-content: center; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; }
    
    .controls {
      background: var(--card-bg); padding: 20px; border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0, 168, 181, 0.08); width: 380px; max-height: 88vh; overflow-y: auto;
    }

    .section-title {
      font-size: 12px; font-weight: 700; color: var(--brand-cyan); text-transform: uppercase;
      margin: 16px 0 8px 0; border-bottom: 2px solid #e6f6f7; padding-bottom: 4px;
    }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: #5a6578; margin-bottom: 4px; }
    .form-group input, .form-group select { 
      width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); 
      background: #fff; color: var(--brand-dark); border-radius: 6px; font-size: 13px; outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--brand-cyan); }

    .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-tool { 
      background: #e6f6f7; color: var(--brand-cyan); border: 1px solid var(--border-color); 
      padding: 8px; border-radius: 6px; cursor: pointer; flex: 1; font-weight: 600; font-size: 12px; 
    }
    .btn-tool:hover { background: #d0f0f2; }

    .preview-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    
    .toggle-buttons { display: flex; background: #e6f6f7; padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); }
    .toggle-buttons button { border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; background: transparent; color: #5a6578; }
    .toggle-buttons button.active { background: var(--brand-cyan); color: #ffffff; box-shadow: 0 2px 4px rgba(0, 168, 181, 0.25); }

    /* Click Vectora Branded Card Canvas */
    .card-box {
      width: 350px; height: 200px; border-radius: 10px; padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); position: relative;
      display: flex; flex-direction: column; justify-content: space-between;
      overflow: hidden; box-sizing: border-box; background-color: #ffffff; color: var(--brand-dark);
      border-left: 6px solid var(--brand-cyan); transition: all 0.2s ease;
    }

    .logo-container { overflow: hidden; display: inline-block; max-height: 40px; max-width: 100px; margin-bottom: 4px; }
    .logo-img { height: 100%; width: 100%; object-fit: contain; transform: scale(1); }

    .card-front { display: flex; justify-content: space-between; height: 100%; position: relative; z-index: 2; }
    .card-info { display: flex; flex-direction: column; justify-content: space-between; width: 65%; }
    
    .card-name { font-size: 18px; font-weight: bold; margin: 0; color: var(--brand-dark); }
    .card-title { font-size: 11px; color: var(--brand-cyan); margin-top: 2px; font-weight: 600; }
    .card-contacts { font-size: 11px; line-height: 1.6; color: var(--brand-dark); }
    
    #qrcode { background: white; padding: 4px; border-radius: 6px; border: 1px solid var(--border-color); align-self: flex-end; display: flex; align-items: center; justify-content: center; }
    .card-back { display: none; height: 100%; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; z-index: 2; }

    .action-buttons { display: flex; gap: 10px; width: 100%; }
    .btn-pay-orange { 
      background: var(--brand-orange); color: white; border: none; padding: 12px; 
      border-radius: 8px; font-weight: 700; cursor: pointer; flex: 1; text-align: center; font-size: 13px; 
      box-shadow: 0 4px 10px rgba(243, 112, 33, 0.25);
    }
    .btn-pay-orange:hover { background: #d95e14; }

    .btn-pay-blue { 
      background: var(--brand-blue); color: white; border: none; padding: 12px; 
      border-radius: 8px; font-weight: 700; cursor: pointer; flex: 1; text-align: center; font-size: 13px; 
      box-shadow: 0 4px 10px rgba(0, 119, 200, 0.25);
    }
    .btn-pay-blue:hover { background: #005f9e; }
  </style>
</head>
<body>

  <!-- Brand Header with Logo -->
  <div class="brand-header">
    <img id="headerLogo" src="" alt="Click Vectora Solution">
    <h2>BUSINESS CARD STUDIO</h2>
    <span>CLICK VECTORA SOLUTION</span>
  </div>

  <div class="wrapper">
    <!-- Controls Panel -->
    <div class="controls">
      <div class="btn-row">
        <button class="btn-tool" onclick="undo()">↩ Undo</button>
        <button class="btn-tool" onclick="redo()">↪ Redo</button>
      </div>

      <div class="section-title">1. Custom Logo Crop & Scale</div>
      <div class="form-group">
        <label>Upload Custom Logo (Optional)</label>
        <input type="file" id="logoInput" accept="image/*" onchange="handleLogoUpload(event)">
      </div>
      <div class="form-group">
        <label>Logo Zoom / Crop Scale</label>
        <input type="range" id="logoZoom" min="0.5" max="2.5" step="0.1" value="1" oninput="applyLogoTransform()">
      </div>

      <div class="section-title">2. Text & Design Tools</div>
      <div class="form-group">
        <label>Text Alignment</label>
        <select id="textAlign" onchange="applyDesignTools()">
          <option value="left">Left Aligned</option>
          <option value="center">Center Aligned</option>
          <option value="right">Right Aligned</option>
        </select>
      </div>
      <div class="form-group">
        <label>Card Brightness</label>
        <input type="range" id="cardBrightness" min="50" max="150" value="100" oninput="applyDesignTools()">
      </div>

      <div class="section-title">3. Card Details</div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="inputName" placeholder="Rahul Sharma" oninput="onInputChange()">
      </div>
      <div class="form-group">
        <label>Designation</label>
        <input type="text" id="inputTitle" placeholder="Lead Graphic Designer" oninput="onInputChange()">
      </div>
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="inputCompany" value="Click Vectora Solution" oninput="onInputChange()">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="inputPhone" placeholder="+91 98765 43210" oninput="onInputChange()">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="text" id="inputEmail" placeholder="rahul@clickvectora.com" oninput="onInputChange()">
      </div>
      <div class="form-group">
        <label>Website URL (QR Code)</label>
        <input type="text" id="inputWebsite" placeholder="https://clickvectora.com" oninput="onInputChange()">
      </div>
    </div>

    <!-- Preview Section -->
    <div class="preview-container">
      <div class="toggle-buttons">
        <button id="btnFront" class="active" onclick="toggleSide('front')">Front View</button>
        <button id="btnBack" onclick="toggleSide('back')">Back View</button>
      </div>

      <div id="cardCanvas" class="card-box">
        <!-- Front View -->
        <div id="frontView" class="card-front">
          <div class="card-info" id="cardInfoBlock">
            <div>
              <div class="logo-container">
                <img id="frontLogo" class="logo-img" alt="Logo">
              </div>
              <p class="card-name" id="cardName">Rahul Sharma</p>
              <p class="card-title" id="cardTitle">Lead Graphic Designer</p>
            </div>
            <div class="card-contacts">
              <p id="cardPhone">📞 +91 98765 43210</p>
              <p id="cardEmail">✉️ rahul@clickvectora.com</p>
            </div>
          </div>
          <div id="qrcode"></div>
        </div>

        <!-- Back View -->
        <div id="backView" class="card-back">
          <div class="logo-container" style="max-height: 55px; max-width: 140px; margin-bottom: 8px;">
            <img id="backLogo" class="logo-img" alt="Logo">
          </div>
          <h3 id="cardCompany" style="margin: 0; color: var(--brand-cyan); font-size: 16px;">Click Vectora Solution</h3>
          <p id="cardTagline" style="font-size: 11px; color: #5a6578; margin-top: 4px;">Vector & Graphic Design Excellence</p>
        </div>
      </div>

      <!-- Payment & Download Buttons -->
      <div class="action-buttons">
        <button class="btn-pay-orange" onclick="payAndDownload('png')">Pay ₹99 & Download PNG</button>
        <button class="btn-pay-blue" onclick="payAndDownload('pdf')">Pay ₹99 & Download PDF</button>
      </div>
    </div>
  </div>

  <script>
    // Click Vectora Logo Base64 Data Placeholder / Runtime Image Binding
    const vectoraLogoSrc = "1000231418.png"; 

    let currentSide = 'front';
    let qrCodeInstance = null;
    let historyStack = [];
    let historyStep = -1;

    window.onload = function() {
      document.getElementById('headerLogo').src = vectoraLogoSrc;
      document.getElementById('frontLogo').src = vectoraLogoSrc;
      document.getElementById('backLogo').src = vectoraLogoSrc;

      qrCodeInstance = new QRCode(document.getElementById("qrcode"), {
        width: 50, height: 50, colorDark : "#00a8b5", colorLight : "#ffffff"
      });
      saveState();
      updateCard();
    };

    function saveState() {
      const state = {
        name: document.getElementById('inputName').value,
        title: document.getElementById('inputTitle').value,
        company: document.getElementById('inputCompany').value,
        phone: document.getElementById('inputPhone').value,
        email: document.getElementById('inputEmail').value,
        align: document.getElementById('textAlign').value,
        zoom: document.getElementById('logoZoom').value,
        brightness: document.getElementById('cardBrightness').value
      };

      historyStack = historyStack.slice(0, historyStep + 1);
      historyStack.push(state);
      historyStep++;
    }

    function undo() {
      if (historyStep > 0) {
        historyStep--;
        applyState(historyStack[historyStep]);
      }
    }

    function redo() {
      if (historyStep < historyStack.length - 1) {
        historyStep++;
        applyState(historyStack[historyStep]);
      }
    }

    function applyState(state) {
      document.getElementById('inputName').value = state.name;
      document.getElementById('inputTitle').value = state.title;
      document.getElementById('inputCompany').value = state.company;
      document.getElementById('inputPhone').value = state.phone;
      document.getElementById('inputEmail').value = state.email;
      document.getElementById('textAlign').value = state.align;
      document.getElementById('logoZoom').value = state.zoom;
      document.getElementById('cardBrightness').value = state.brightness;

      updateCard();
      applyLogoTransform();
      applyDesignTools();
    }

    function onInputChange() {
      updateCard();
      saveState();
    }

    function handleLogoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const logoData = e.target.result;
          document.getElementById('frontLogo').src = logoData;
          document.getElementById('backLogo').src = logoData;
          saveState();
        };
        reader.readAsDataURL(file);
      }
    }

    function applyLogoTransform() {
      const scale = document.getElementById('logoZoom').value;
      document.getElementById('frontLogo').style.transform = `scale(${scale})`;
      document.getElementById('backLogo').style.transform = `scale(${scale})`;
    }

    function applyDesignTools() {
      const align = document.getElementById('textAlign').value;
      const brightness = document.getElementById('cardBrightness').value;

      document.getElementById('cardInfoBlock').style.textAlign = align;
      document.getElementById('cardCanvas').style.filter = `brightness(${brightness}%)`;
    }

    function updateCard() {
      const name = document.getElementById('inputName').value || "Rahul Sharma";
      const title = document.getElementById('inputTitle').value || "Lead Graphic Designer";
      const company = document.getElementById('inputCompany').value || "Click Vectora Solution";
      const phone = document.getElementById('inputPhone').value || "+91 98765 43210";
      const email = document.getElementById('inputEmail').value || "rahul@clickvectora.com";
      const website = document.getElementById('inputWebsite').value || "https://clickvectora.com";

      document.getElementById('cardName').innerText = name;
      document.getElementById('cardTitle').innerText = title;
      document.getElementById('cardCompany').innerText = company;
      document.getElementById('cardPhone').innerText = "📞 " + phone;
      document.getElementById('cardEmail').innerText = "✉️ " + email;

      if (qrCodeInstance) {
        qrCodeInstance.clear();
        qrCodeInstance.makeCode(website);
      }
    }

    function toggleSide(side) {
      currentSide = side;
      document.getElementById('btnFront').className = side === 'front' ? 'active' : '';
      document.getElementById('btnBack').className = side === 'back' ? 'active' : '';
      document.getElementById('frontView').style.display = side === 'front' ? 'flex' : 'none';
      document.getElementById('backView').style.display = side === 'back' ? 'flex' : 'none';
    }

    function payAndDownload(format) {
      const options = {
        "key": "YOUR_RAZORPAY_KEY_ID",
        "amount": 9900,
        "currency": "INR",
        "name": "Click Vectora Studio",
        "description": "HD Card Download",
        "handler": function (response) {
          executeDownload(format);
        },
        "prefill": {
          "name": document.getElementById('cardName').innerText,
          "email": document.getElementById('inputEmail').value
        },
        "theme": { "color": "#00a8b5" }
      };

      if (options.key === "YOUR_RAZORPAY_KEY_ID") {
        executeDownload(format);
      } else {
        const rzp = new Razorpay(options);
        rzp.open();
      }
    }

    function executeDownload(format) {
      const card = document.getElementById('cardCanvas');
      html2canvas(card, { scale: 3 }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');

        if (format === 'png') {
          const link = document.createElement('a');
          link.download = `click-vectora-card-${currentSide}.png`;
          link.href = imgData;
          link.click();
        } else if (format === 'pdf') {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: 'landscape', unit: 'in', format: [3.5, 2] });
          pdf.addImage(imgData, 'PNG', 0, 0, 3.5, 2);
          pdf.save(`click-vectora-card-${currentSide}.pdf`);
        }
      });
    }
  </script>
</body>
</html>
