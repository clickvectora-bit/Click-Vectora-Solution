<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Business Card Studio Pro</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #FF6B00;
      --primary-hover: #E05D00;
      --bg-workspace: #CBD5E1;
      --border-color: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #64748B;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; touch-action: manipulation; }
    body { display: flex; flex-direction: column; height: 100vh; background: var(--bg-workspace); color: var(--text-main); overflow: hidden; }

    /* Top Features Bar */
    .top-bar {
      width: 100%;
      background: #FFFFFF;
      border-bottom: 1px solid #94A3B8;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 4px;
    }

    .brand { font-size: 1rem; font-weight: 700; color: var(--primary); }

    .toolbar-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #F1F5F9;
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid #CBD5E1;
      flex-wrap: wrap;
    }

    .section-title { 
      font-weight: 600; 
      font-size: 0.65rem; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      letter-spacing: 0.3px; 
      margin-right: 2px;
    }

    .btn-group { display: flex; gap: 3px; flex-wrap: wrap; }
    
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 4px 7px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      font-size: 0.72rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #FFF; color: var(--text-main); border: 1px solid #CBD5E1; }
    button.secondary:hover { background: #F8FAFC; border-color: #64748B; }
    button.active-side { background: #0F172A; color: white; }
    button.danger { background: #EF4444; }
    button.danger:hover { background: #DC2626; }

    input, select {
      padding: 3px 5px;
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      outline: none;
      font-size: 0.72rem;
      background: #FAFAFA;
    }
    input[type="text"] { width: 110px; }
    input[type="file"] { width: 150px; font-size: 0.65rem; }
    input[type="color"] { height: 24px; width: 26px; cursor: pointer; padding: 1px; }

    /* Tight Workspace Area */
    .workspace {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 4px;
      margin: 0;
      background: radial-gradient(#94A3B8 1px, transparent 1px);
      background-size: 12px 12px;
    }

    /* Top Canvas Floating Controls */
    .canvas-top-controls {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      z-index: 5;
    }

    .canvas-container-wrapper {
      background: #FFFFFF;
      box-shadow: 0 15px 35px -5px rgba(15, 23, 42, 0.3);
      position: relative;
    }

    .canvas-container-wrapper.rounded {
      border-radius: 16px;
      overflow: hidden;
    }

    /* Bottom Canvas Floating Controls */
    .canvas-bottom-controls {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 8px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      z-index: 5;
    }

    /* Bottom Action Bar */
    .bottom-action-bar {
      width: 100%;
      background: #FFFFFF;
      border-top: 1px solid #94A3B8;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal {
      background: white;
      padding: 16px;
      border-radius: 12px;
      width: 320px;
      max-width: 90%;
      text-align: center;
    }

    /* Single 3D Card Modal Styling */
    .modal-3d {
      width: 650px !important;
      max-width: 95% !important;
      padding: 20px !important;
    }

    .card-3d-container {
      width: 520px;
      height: 297px;
      perspective: 1200px;
      margin: 15px auto;
    }

    @media (max-width: 600px) {
      .card-3d-container {
        width: 320px;
        height: 183px;
      }
    }

    .card-3d-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      border-radius: 12px;
    }

    .card-3d-inner.flipped { transform: rotateY(180deg); }

    .card-3d-front, .card-3d-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .card-3d-back { transform: rotateY(180deg); }

    #qrcode-hidden { display: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand-row">
      <div class="brand">🎴 Card Studio Pro</div>
    </div>

    <div class="toolbar-grid">
      
      <div class="tool-group">
        <span class="section-title">Layout</span>
        <div class="btn-group">
          <button class="secondary" onclick="setOrientation('horizontal')">Horiz</button>
          <button class="secondary" onclick="setOrientation('vertical')">Vert</button>
          <button class="secondary" onclick="toggleRounded()">Radius</button>
        </div>
      </div>

      <div class="tool-group">
        <span class="section-title">Layers</span>
        <div class="btn-group">
          <button class="secondary" onclick="changeLayer('front')">🔝 Front</button>
          <button class="secondary" onclick="changeLayer('forward')">🔼 Up</button>
          <button class="secondary" onclick="changeLayer('backward')">🔽 Down</button>
          <button class="secondary" onclick="changeLayer('back')">🔚 Back</button>
          <button class="danger" onclick="deleteSelected()" style="margin-left: 2px;">🗑️ Delete</button>
        </div>
      </div>

      <div class="tool-group">
        <span class="section-title">Text</span>
        <button onclick="addText()">+ Text</button>
        <input type="color" id="textColor" onchange="updateTextProperty('fill', this.value)" value="#0F172A" title="Text Color">
        <select id="fontFamily" onchange="updateTextProperty('fontFamily', this.value)">
          <option value="Poppins">Poppins</option>
          <option value="Montserrat">Montserrat</option>
          <option value="Roboto">Roboto</option>
          <option value="Playfair Display">Playfair</option>
        </select>
        <div class="btn-group">
          <button class="secondary" onclick="toggleStyle('bold')"><b>B</b></button>
          <button class="secondary" onclick="toggleStyle('italic')"><i>I</i></button>
          <button class="secondary" onclick="toggleStyle('underline')"><u>U</u></button>
        </div>
      </div>

      <div class="tool-group">
        <span class="section-title">Shapes & Border</span>
        <div class="btn-group">
          <button class="secondary" onclick="addShape('rect')">Rect</button>
          <button class="secondary" onclick="addShape('circle')">Circle</button>
          <button class="secondary" onclick="addShape('triangle')">Triangle</button>
          <button class="secondary" onclick="addShape('line')">Line</button>
        </div>
        
        <span style="font-size:0.65rem; margin-left:2px;">Fill:</span>
        <input type="color" id="shapeFillColor" onchange="updateShapeProperty('fill', this.value)" value="#FF6B00">
        <button class="secondary" style="padding:2px 4px; font-size:0.65rem;" onclick="updateShapeProperty('fill', 'transparent')">None</button>

        <span style="font-size:0.65rem;">Border:</span>
        <input type="color" id="shapeBorderColor" onchange="updateShapeProperty('stroke', this.value)" value="#000000">
        <button class="secondary" style="padding:2px 4px; font-size:0.65rem;" onclick="updateShapeProperty('stroke', 'transparent')">None</button>

        <span style="font-size:0.65rem;">Width:</span>
        <input type="range" id="shapeBorderSize" min="0" max="20" value="0" oninput="updateShapeProperty('strokeWidth', parseInt(this.value))" style="width: 45px;">
      </div>

      <div class="tool-group">
        <span class="section-title">Image</span>
        <input type="file" id="imageLoader" accept="image/*" multiple>
      </div>

      <div class="tool-group">
        <span class="section-title">QR</span>
        <input type="text" id="qrInput" placeholder="URL/UPI">
        <button onclick="addQRCode()">Generate</button>
      </div>

    </div>
  </div>

  <div class="workspace" id="workspace">
    
    <div class="canvas-top-controls">
      <button id="btnSideA" class="active-side" onclick="switchSide('front')">Side A (Front)</button>
      <button id="btnSideB" class="secondary" onclick="switchSide('back')">Side B (Back)</button>
      <button style="background: #8B5CF6;" onclick="open3DPreview()">3D Preview</button>
    </div>

    <div class="canvas-container-wrapper" id="canvasWrapper">
      <canvas id="cardCanvas"></canvas>
    </div>

    <div class="canvas-bottom-controls">
      <button class="secondary" id="bleedBtn" onclick="toggleGuide('bleed')">Bleed Line: ON</button>
      <button class="secondary" id="trimBtn" onclick="toggleGuide('trim')">Trim Line: ON</button>
      <button class="secondary" id="safetyBtn" onclick="toggleGuide('safety')">Safety Line: ON</button>
    </div>

  </div>

  <div class="bottom-action-bar">
    <span style="font-size:0.75rem; font-weight:600; color:var(--text-muted);">High-Res Exports</span>
    <div class="btn-group">
      <button style="background: #10B981; padding: 6px 14px;" onclick="initiatePayment('png')">Download PNG</button>
      <button style="background: #2563EB; padding: 6px 14px;" onclick="initiatePayment('pdf')">Download PDF</button>
    </div>
  </div>

  <div class="modal-overlay" id="preview3DModal">
    <div class="modal modal-3d">
      <h3>3D Print Preview</h3>
      <div class="card-3d-container">
        <div class="card-3d-inner" id="card3dInner">
          <div class="card-3d-front" id="card3dFront"></div>
          <div class="card-3d-back" id="card3dBack"></div>
        </div>
      </div>
      
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
        <button class="secondary" style="padding: 6px 16px;" onclick="flip3DCard()">🔄 Flip Card Side</button>
        <button style="padding: 6px 16px;" onclick="close3DModal()">Close Preview</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="paymentModal">
    <div class="modal">
      <h3>Unlock HD Download</h3>
      <p>Print-Ready Vectors without Print Guides</p>
      <div style="font-size: 1.8rem; font-weight:700; color:var(--primary); margin:8px 0;">₹49</div>
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button class="secondary" style="flex:1;" onclick="closeModal()">Cancel</button>
        <button style="flex:1;" onclick="processRazorpay()">Pay with Razorpay</button>
      </div>
    </div>
  </div>

  <div id="qrcode-hidden"></div>

  <script>
    const BASE_WIDTH = 1000;
    const BASE_HEIGHT = 571;

    // Print Guides Padding Margins
    const BLEED_MARGIN = 10;
    const TRIM_MARGIN = 22;
    const SAFETY_MARGIN = 42;

    let currentSide = 'front';
    let canvasStates = { front: null, back: null };
    
    let showBleed = true;
    let showTrim = true;
    let showSafety = true;

    let guideObjects = { bleed: null, trim: null, safety: null };

    let isRounded = false;
    let selectedExportType = 'png';
    let currentOrientation = 'horizontal';

    let canvas = new fabric.Canvas('cardCanvas', {
      backgroundColor: '#ffffff',
      preserveObjectStacking: true,
      allowTouchScrolling: false
    });

    // Render Print Guides Always On Top
    function renderPrintGuides() {
      ['bleed', 'trim', 'safety'].forEach(type => {
        if (guideObjects[type]) {
          canvas.remove(guideObjects[type]);
          guideObjects[type] = null;
        }
      });

      let targetW = currentOrientation === 'horizontal' ? BASE_WIDTH : BASE_HEIGHT;
      let targetH = currentOrientation === 'horizontal' ? BASE_HEIGHT : BASE_WIDTH;

      if (showBleed) {
        guideObjects.bleed = new fabric.Rect({
          left: BLEED_MARGIN, top: BLEED_MARGIN,
          width: targetW - (BLEED_MARGIN * 2), height: targetH - (BLEED_MARGIN * 2),
          fill: 'transparent', stroke: '#EF4444', strokeWidth: 2, strokeDashArray: [6, 6],
          selectable: false, evented: false, excludeFromExport: true
        });
        canvas.add(guideObjects.bleed);
      }

      if (showTrim) {
        guideObjects.trim = new fabric.Rect({
          left: TRIM_MARGIN, top: TRIM_MARGIN,
          width: targetW - (TRIM_MARGIN * 2), height: targetH - (TRIM_MARGIN * 2),
          fill: 'transparent', stroke: '#0F172A', strokeWidth: 2,
          selectable: false, evented: false, excludeFromExport: true
        });
        canvas.add(guideObjects.trim);
      }

      if (showSafety) {
        guideObjects.safety = new fabric.Rect({
          left: SAFETY_MARGIN, top: SAFETY_MARGIN,
          width: targetW - (SAFETY_MARGIN * 2), height: targetH - (SAFETY_MARGIN * 2),
          fill: 'transparent', stroke: '#10B981', strokeWidth: 2, strokeDashArray: [4, 4],
          selectable: false, evented: false, excludeFromExport: true
        });
        canvas.add(guideObjects.safety);
      }

      bringGuidesToFront();
      canvas.renderAll();
    }

    function bringGuidesToFront() {
      Object.values(guideObjects).forEach(obj => {
        if (obj) canvas.bringToFront(obj);
      });
    }

    function toggleGuide(type) {
      if (type === 'bleed') {
        showBleed = !showBleed;
        document.getElementById('bleedBtn').innerText = `Bleed Line: ${showBleed ? 'ON' : 'OFF'}`;
      } else if (type === 'trim') {
        showTrim = !showTrim;
        document.getElementById('trimBtn').innerText = `Trim Line: ${showTrim ? 'ON' : 'OFF'}`;
      } else if (type === 'safety') {
        showSafety = !showSafety;
        document.getElementById('safetyBtn').innerText = `Safety Line: ${showSafety ? 'ON' : 'OFF'}`;
      }
      renderPrintGuides();
    }

    // Layer Arrangement
    function changeLayer(action) {
      const activeObject = canvas.getActiveObject();
      if (!activeObject || Object.values(guideObjects).includes(activeObject)) return;

      if (action === 'front') canvas.bringToFront(activeObject);
      else if (action === 'forward') canvas.bringForward(activeObject);
      else if (action === 'backward') canvas.sendBackwards(activeObject);
      else if (action === 'back') canvas.sendToBack(activeObject);

      bringGuidesToFront();
      canvas.renderAll();
    }

    // Canvas Auto Scaling
    function resizeCanvasToFitContainer() {
      const workspace = document.getElementById('workspace');
      const topControlsH = document.querySelector('.canvas-top-controls').offsetHeight || 30;
      const bottomControlsH = document.querySelector('.canvas-bottom-controls').offsetHeight || 30;
      
      const maxWidth = workspace.clientWidth - 10;
      const maxHeight = workspace.clientHeight - topControlsH - bottomControlsH - 20;

      let targetW = currentOrientation === 'horizontal' ? BASE_WIDTH : BASE_HEIGHT;
      let targetH = currentOrientation === 'horizontal' ? BASE_HEIGHT : BASE_WIDTH;

      let scale = Math.min(maxWidth / targetW, maxHeight / targetH);

      canvas.setDimensions({
        width: targetW * scale,
        height: targetH * scale
      });

      canvas.setZoom(scale);
      renderPrintGuides();
    }

    window.addEventListener('resize', resizeCanvasToFitContainer);

    // Front/Back Switcher
    function switchSide(side) {
      if (currentSide === side) return;

      canvasStates[currentSide] = canvas.toJSON();

      currentSide = side;
      document.getElementById('btnSideA').className = side === 'front' ? 'active-side' : 'secondary';
      document.getElementById('btnSideB').className = side === 'back' ? 'active-side' : 'secondary';

      canvas.clear();
      canvas.backgroundColor = '#ffffff';

      if (canvasStates[side]) {
        canvas.loadFromJSON(canvasStates[side], () => {
          resizeCanvasToFitContainer();
        });
      } else {
        resizeCanvasToFitContainer();
      }
    }

    // Single Card 3D Preview Engine
    function open3DPreview() {
      canvasStates[currentSide] = canvas.toJSON();

      hideGuidesForExport();

      const currentData = canvas.toDataURL({ format: 'png', quality: 1 });

      let frontImg = currentSide === 'front' ? currentData : null;
      let backImg = currentSide === 'back' ? currentData : null;

      const tempCanvas = new fabric.Canvas(null, { width: BASE_WIDTH, height: BASE_HEIGHT, backgroundColor: '#ffffff' });
      const otherSide = currentSide === 'front' ? 'back' : 'front';

      if (canvasStates[otherSide]) {
        tempCanvas.loadFromJSON(canvasStates[otherSide], () => {
          tempCanvas.getObjects().forEach(o => { if(o.excludeFromExport) o.visible = false; });
          tempCanvas.renderAll();
          const otherData = tempCanvas.toDataURL({ format: 'png', quality: 1 });

          if (currentSide === 'front') backImg = otherData;
          else frontImg = otherData;

          apply3DImages(frontImg, backImg);
        });
      } else {
        if (!frontImg) frontImg = currentData;
        if (!backImg) backImg = currentData;
        apply3DImages(frontImg, backImg);
      }

      restoreGuidesAfterExport();
      document.getElementById('preview3DModal').style.display = 'flex';
    }

    function apply3DImages(frontImg, backImg) {
      document.getElementById('card3dFront').style.backgroundImage = `url(${frontImg})`;
      document.getElementById('card3dBack').style.backgroundImage = `url(${backImg})`;
    }

    function flip3DCard() {
      document.getElementById('card3dInner').classList.toggle('flipped');
    }

    function close3DModal() {
      document.getElementById('preview3DModal').style.display = 'none';
      document.getElementById('card3dInner').classList.remove('flipped');
    }

    function setOrientation(type) {
      currentOrientation = type;
      resizeCanvasToFitContainer();
    }

    function toggleRounded() {
      const wrapper = document.getElementById('canvasWrapper');
      isRounded = !isRounded;
      wrapper.classList.toggle('rounded', isRounded);
    }

    fabric.Object.prototype.set({
      transparentCorners: false,
      cornerColor: '#FF6B00',
      cornerStrokeColor: '#FFFFFF',
      borderColor: '#FF6B00',
      cornerSize: 12,
      cornerStyle: 'circle',
      borderDashArray: [4, 4]
    });

    // Object Creators & Properties Handlers
    function addText() {
      const text = new fabric.IText('Your Name / Title', { left: 100, top: 100, fontFamily: 'Poppins', fill: '#0F172A', fontSize: 32 });
      canvas.add(text);
      canvas.setActiveObject(text);
      bringGuidesToFront();
    }

    function updateTextProperty(prop, value) {
      const activeObject = canvas.getActiveObject();
      if (activeObject && activeObject.isType('i-text')) {
        activeObject.set(prop, value);
        canvas.renderAll();
      }
    }

    function toggleStyle(style) {
      const activeObject = canvas.getActiveObject();
      if (activeObject && activeObject.isType('i-text')) {
        if (style === 'bold') activeObject.set('fontWeight', activeObject.fontWeight === 'bold' ? 'normal' : 'bold');
        if (style === 'italic') activeObject.set('fontStyle', activeObject.fontStyle === 'italic' ? 'normal' : 'italic');
        if (style === 'underline') activeObject.set('underline', !activeObject.underline);
        canvas.renderAll();
      }
    }

    function addShape(type) {
      let shape;
      let fillColor = document.getElementById('shapeFillColor').value;
      let borderColor = document.getElementById('shapeBorderColor').value;
      let borderSize = parseInt(document.getElementById('shapeBorderSize').value);

      const baseOpts = {
        left: 100, top: 100,
        fill: fillColor,
        stroke: borderColor,
        strokeWidth: borderSize,
        strokeUniform: true
      };

      if (type === 'rect') shape = new fabric.Rect({ ...baseOpts, width: 160, height: 100 });
      else if (type === 'circle') shape = new fabric.Circle({ ...baseOpts, radius: 60 });
      else if (type === 'triangle') shape = new fabric.Triangle({ ...baseOpts, width: 120, height: 120 });
      else if (type === 'line') shape = new fabric.Line([80, 100, 300, 100], { stroke: fillColor, strokeWidth: borderSize || 4 });

      canvas.add(shape);
      canvas.setActiveObject(shape);
      bringGuidesToFront();
    }

    function updateShapeProperty(prop, value) {
      const activeObject = canvas.getActiveObject();
      if (activeObject && !activeObject.isType('i-text') && !Object.values(guideObjects).includes(activeObject)) {
        activeObject.set(prop, value);
        activeObject.set('strokeUniform', true);
        canvas.renderAll();
      }
    }

    // Multiple Image Loader Support
    document.getElementById('imageLoader').addEventListener('change', function (e) {
      const files = e.target.files;
      if (!files || !files.length) return;

      Array.from(files).forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = function (event) {
          fabric.Image.fromURL(event.target.result, function (img) {
            img.scaleToWidth(180);
            // Offset positioning for multiple images
            img.set({
              left: 100 + (index * 20),
              top: 100 + (index * 20)
            });
            canvas.add(img);
            canvas.setActiveObject(img);
            bringGuidesToFront();
          });
        };
        reader.readAsDataURL(file);
      });
      
      // Clear value so user can upload same files again if needed
      e.target.value = '';
    });

    function addQRCode() {
      const text = document.getElementById('qrInput').value.trim();
      if (!text) return alert('Enter URL / UPI');
      const qrContainer = document.getElementById('qrcode-hidden');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, { text: text, width: 200, height: 200 });

      setTimeout(() => {
        const imgTag = qrContainer.querySelector('img');
        if (imgTag) {
          fabric.Image.fromURL(imgTag.src, function (img) {
            img.scaleToWidth(140);
            img.set({ left: 100, top: 100 });
            canvas.add(img);
            canvas.setActiveObject(img);
            bringGuidesToFront();
          });
        }
      }, 100);
    }

    function deleteSelected() {
      const activeObjects = canvas.getActiveObjects();
      if (activeObjects.length) {
        activeObjects.forEach(obj => {
          if (!Object.values(guideObjects).includes(obj)) canvas.remove(obj);
        });
        canvas.discardActiveObject();
      }
    }

    function hideGuidesForExport() {
      Object.values(guideObjects).forEach(obj => {
        if (obj) obj.visible = false;
      });
      canvas.renderAll();
    }

    function restoreGuidesAfterExport() {
      if (guideObjects.bleed && showBleed) guideObjects.bleed.visible = true;
      if (guideObjects.trim && showTrim) guideObjects.trim.visible = true;
      if (guideObjects.safety && showSafety) guideObjects.safety.visible = true;
      canvas.renderAll();
    }

    // Payment & Download Handlers
    function initiatePayment(type) {
      selectedExportType = type;
      document.getElementById('paymentModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('paymentModal').style.display = 'none';
    }

    function processRazorpay() {
      closeModal();
      var options = {
        "key": "YOUR_RAZORPAY_KEY_ID",
        "amount": 4900,
        "currency": "INR",
        "name": "Business Card Studio",
        "description": "HD Export Payment",
        "handler": function (response) {
          downloadCard(selectedExportType);
        },
        "theme": { "color": "#FF6B00" }
      };
      var rzp1 = new Razorpay(options);
      rzp1.open();
    }

    function downloadCard(format) {
      hideGuidesForExport();

      const dataURL = canvas.toDataURL({
        format: 'png',
        quality: 1.0,
        multiplier: 2 / canvas.getZoom()
      });

      restoreGuidesAfterExport();

      if (format === 'png') {
        const link = document.createElement('a');
        link.download = `business-card-${currentSide}-hd.png`;
        link.href = dataURL;
        link.click();
      } else if (format === 'pdf') {
        const { jsPDF } = window.jspdf;
        const w = currentOrientation === 'horizontal' ? BASE_WIDTH : BASE_HEIGHT;
        const h = currentOrientation === 'horizontal' ? BASE_HEIGHT : BASE_WIDTH;
        
        const pdf = new jsPDF({
          orientation: currentOrientation === 'horizontal' ? 'landscape' : 'portrait',
          unit: 'px',
          format: [w, h]
        });

        pdf.addImage(dataURL, 'PNG', 0, 0, w, h);
        pdf.save(`business-card-${currentSide}-hd.pdf`);
      }
    }

    setTimeout(resizeCanvasToFitContainer, 100);
  </script>
</body>
</html>
