<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Business Card Studio - Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;700&family=Playfair+Display:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #FF6B00;
      --primary-hover: #E05D00;
      --bg-light: #F8F9FA;
      --border-color: #E2E8F0;
      --dark-text: #1E293B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { display: flex; height: 100vh; background: var(--bg-light); color: var(--dark-text); overflow: hidden; }

    /* Sidebar Controls */
    .sidebar {
      width: 380px;
      background: #FFFFFF;
      border-right: 1px solid var(--border-color);
      padding: 20px;
      overflow-y: auto;
      box-shadow: 2px 0 10px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .brand { font-size: 1.4rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #FFF1E6; padding-bottom: 12px; }
    .section-title { font-weight: 600; font-size: 0.85rem; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:hover { background: var(--primary-hover); transform: translateY(-1px); }
    button.secondary { background: #FFF; color: #333; border: 1px solid var(--border-color); }
    button.secondary:hover { background: #F8FAFC; border-color: #CBD5E1; }
    button.danger { background: #EF4444; }
    button.danger:hover { background: #DC2626; }

    input, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
      background: #FAFAFA;
      transition: border 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary); background: #FFF; }

    /* Workspace / Canvas Area */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F1F5F9;
      position: relative;
      overflow: auto;
      padding: 20px;
    }

    .canvas-container-wrapper {
      border: 2px dashed #CBD5E1;
      padding: 8px;
      background: #FFFFFF;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }
    .canvas-container-wrapper.rounded {
      border-radius: 20px;
      overflow: hidden;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      padding: 24px;
      border-radius: 12px;
      width: 400px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .modal h3 { margin-bottom: 12px; color: var(--dark-text); }
    .modal p { font-size: 0.9rem; color: #64748B; margin-bottom: 20px; }
    .price-tag { font-size: 1.8rem; font-weight: 700; color: var(--primary); margin: 10px 0; }

    /* Hidden Helper Container */
    #qrcode-hidden { display: none; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand">🎴 Business Card Studio</div>

    <div>
      <div class="section-title">Canvas Setup</div>
      <div class="btn-group" style="margin-top: 6px;">
        <button onclick="setOrientation('horizontal')">Horizontal</button>
        <button onclick="setOrientation('vertical')">Vertical</button>
        <button class="secondary" onclick="toggleRounded()">Toggle Radius</button>
      </div>
    </div>

    <div>
      <div class="section-title">Zoom Controls</div>
      <div class="btn-group" style="margin-top: 6px;">
        <button class="secondary" onclick="zoomCanvas(0.1)">Zoom +</button>
        <button class="secondary" onclick="zoomCanvas(-0.1)">Zoom -</button>
        <button class="secondary" onclick="resetZoom()">Reset</button>
      </div>
    </div>

    <div>
      <div class="section-title">Text Tools</div>
      <button style="width: 100%; margin-top: 6px; margin-bottom: 8px;" onclick="addText()">+ Add Text Layer</button>
      
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="color" id="textColor" onchange="updateTextProperty('fill', this.value)" value="#000000" style="height: 38px; width: 50px; cursor: pointer; padding: 2px;">
        <select id="fontFamily" onchange="updateTextProperty('fontFamily', this.value)">
          <option value="Poppins">Poppins</option>
          <option value="Montserrat">Montserrat</option>
          <option value="Roboto">Roboto</option>
          <option value="Playfair Display">Playfair Display</option>
          <option value="Open Sans">Open Sans</option>
        </select>
      </div>

      <div class="btn-group">
        <button class="secondary" style="flex:1;" onclick="toggleStyle('bold')"><b>B</b></button>
        <button class="secondary" style="flex:1;" onclick="toggleStyle('italic')"><i>I</i></button>
        <button class="secondary" style="flex:1;" onclick="toggleStyle('underline')"><u>U</u></button>
      </div>
    </div>

    <div>
      <div class="section-title">Image / Logo Upload</div>
      <input type="file" id="imageLoader" accept="image/*" style="margin-top: 6px;">
    </div>

    <div>
      <div class="section-title">QR Code Generator</div>
      <input type="text" id="qrInput" placeholder="Enter Website / Phone / UPI" style="margin-top: 6px; margin-bottom: 8px;">
      <button style="width: 100%;" onclick="addQRCode()">Generate QR Code</button>
    </div>

    <div>
      <div class="section-title">Shapes & Accents</div>
      <div class="btn-group" style="margin-top: 6px;">
        <button class="secondary" onclick="addShape('rect')">Rectangle</button>
        <button class="secondary" onclick="addShape('circle')">Circle</button>
        <button class="secondary" onclick="addShape('triangle')">Triangle</button>
        <button class="secondary" onclick="addShape('line')">Line</button>
      </div>
    </div>

    <div style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 14px;">
      <button class="danger" style="width: 100%; margin-bottom: 10px;" onclick="deleteSelected()">Delete Selected Layer</button>
      
      <div class="section-title" style="margin-bottom: 8px;">Export Options (Pay & Download)</div>
      <div style="display: flex; gap: 8px;">
        <button style="flex: 1; background: #10B981;" onclick="initiatePayment('png')">Download PNG</button>
        <button style="flex: 1; background: #2563EB;" onclick="initiatePayment('pdf')">Download PDF</button>
      </div>
    </div>
  </div>

  <div class="workspace" id="workspace">
    <div class="canvas-container-wrapper" id="canvasWrapper">
      <canvas id="cardCanvas"></canvas>
    </div>
  </div>

  <div class="modal-overlay" id="paymentModal">
    <div class="modal">
      <h3>Unlock High-Res Download</h3>
      <p>Pay once to export your customized business card design in print-ready HD format.</p>
      <div class="price-tag">₹49</div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="secondary" style="flex:1;" onclick="closeModal()">Cancel</button>
        <button style="flex:1;" onclick="processRazorpay()">Pay with Razorpay</button>
      </div>
    </div>
  </div>

  <div id="qrcode-hidden"></div>

  <script>
    // Initialize Fabric Canvas
    let canvas = new fabric.Canvas('cardCanvas', {
      backgroundColor: '#ffffff',
      preserveObjectStacking: true
    });

    let currentZoom = 1;
    let isRounded = false;
    let selectedExportType = 'png';

    // Standard 3.5" x 2" Ratio @ 150 DPI scale
    const CARD_WIDTH = 525;
    const CARD_HEIGHT = 300;

    function setOrientation(type) {
      if (type === 'horizontal') {
        canvas.setWidth(CARD_WIDTH);
        canvas.setHeight(CARD_HEIGHT);
      } else {
        canvas.setWidth(CARD_HEIGHT);
        canvas.setHeight(CARD_WIDTH);
      }
      canvas.renderAll();
    }
    setOrientation('horizontal');

    function toggleRounded() {
      const wrapper = document.getElementById('canvasWrapper');
      isRounded = !isRounded;
      wrapper.classList.toggle('rounded', isRounded);
    }

    function zoomCanvas(factor) {
      currentZoom += factor;
      if (currentZoom < 0.5) currentZoom = 0.5;
      if (currentZoom > 2) currentZoom = 2;
      canvas.setZoom(currentZoom);
      canvas.setWidth((canvas.getWidth() / (currentZoom - factor)) * currentZoom);
      canvas.setHeight((canvas.getHeight() / (currentZoom - factor)) * currentZoom);
    }

    function resetZoom() {
      currentZoom = 1;
      canvas.setZoom(1);
      setOrientation(canvas.getWidth() > canvas.getHeight() ? 'horizontal' : 'vertical');
    }

    // Text Handlers
    function addText() {
      const text = new fabric.IText('Your Title / Text', {
        left: 50,
        top: 50,
        fontFamily: 'Poppins',
        fill: '#1E293B',
        fontSize: 18
      });
      canvas.add(text);
      canvas.setActiveObject(text);
    }

    function updateTextProperty(prop, value) {
      const activeObject = canvas.getActiveObject();
      if (activeObject && activeObject.isType('i-text')) {
        activeObject.set(prop, value);
        canvas.renderAll();
      }
    }

    function toggleStyle(style) {
      const activeObject = canvas.getActiveObject();
      if (activeObject && activeObject.isType('i-text')) {
        if (style === 'bold') {
          activeObject.set('fontWeight', activeObject.fontWeight === 'bold' ? 'normal' : 'bold');
        } else if (style === 'italic') {
          activeObject.set('fontStyle', activeObject.fontStyle === 'italic' ? 'normal' : 'italic');
        } else if (style === 'underline') {
          activeObject.set('underline', !activeObject.underline);
        }
        canvas.renderAll();
      }
    }

    // Image Upload
    document.getElementById('imageLoader').addEventListener('change', function (e) {
      const reader = new FileReader();
      reader.onload = function (event) {
        fabric.Image.fromURL(event.target.result, function (img) {
          img.scaleToWidth(120);
          canvas.add(img);
          canvas.setActiveObject(img);
        });
      };
      if (e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    });

    // QR Code Generator
    function addQRCode() {
      const text = document.getElementById('qrInput').value.trim();
      if (!text) return alert('Please enter text/URL for the QR code.');

      const qrContainer = document.getElementById('qrcode-hidden');
      qrContainer.innerHTML = '';

      new QRCode(qrContainer, {
        text: text,
        width: 150,
        height: 150
      });

      setTimeout(() => {
        const imgTag = qrContainer.querySelector('img');
        if (imgTag) {
          fabric.Image.fromURL(imgTag.src, function (img) {
            img.scaleToWidth(90);
            img.set({ left: 100, top: 100 });
            canvas.add(img);
            canvas.setActiveObject(img);
          });
        }
      }, 100);
    }

    // Shapes
    function addShape(type) {
      let shape;
      if (type === 'rect') {
        shape = new fabric.Rect({ width: 100, height: 60, fill: '#FF6B00', left: 100, top: 100 });
      } else if (type === 'circle') {
        shape = new fabric.Circle({ radius: 40, fill: '#FF6B00', left: 100, top: 100 });
      } else if (type === 'triangle') {
        shape = new fabric.Triangle({ width: 80, height: 80, fill: '#FF6B00', left: 100, top: 100 });
      } else if (type === 'line') {
        shape = new fabric.Line([50, 100, 200, 100], { stroke: '#FF6B00', strokeWidth: 3 });
      }
      canvas.add(shape);
      canvas.setActiveObject(shape);
    }

    function deleteSelected() {
      const activeObjects = canvas.getActiveObjects();
      if (activeObjects.length) {
        activeObjects.forEach(obj => canvas.remove(obj));
        canvas.discardActiveObject();
      }
    }

    // Razorpay Integration Logic
    function initiatePayment(type) {
      selectedExportType = type;
      document.getElementById('paymentModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('paymentModal').style.display = 'none';
    }

    function processRazorpay() {
      closeModal();

      var options = {
        "key": "YOUR_RAZORPAY_KEY_ID", // Replace with your actual Razorpay Key ID
        "amount": 4900, // Amount in paise (49 INR = 4900 paise)
        "currency": "INR",
        "name": "Business Card Studio",
        "description": "HD Card Export Payment",
        "image": "https://cdn-icons-png.flaticon.com/512/3135/3135715.png",
        "handler": function (response) {
          alert("Payment Successful! Download starting... Payment ID: " + response.razorpay_payment_id);
          downloadCard(selectedExportType);
        },
        "prefill": {
          "name": "Customer Name",
          "email": "customer@example.com",
          "contact": "9999999999"
        },
        "theme": {
          "color": "#FF6B00"
        }
      };

      var rzp1 = new Razorpay(options);
      rzp1.on('payment.failed', function (response){
        alert("Payment failed or cancelled. Please try again.");
      });
      rzp1.open();
    }

    // File Generation & Download Logic
    function downloadCard(format) {
      resetZoom();
      
      // High quality multipliers (300 DPI equivalency)
      const dataURL = canvas.toDataURL({
        format: 'png',
        quality: 1.0,
        multiplier: 3
      });

      if (format === 'png') {
        const link = document.createElement('a');
        link.download = 'business-card-hd.png';
        link.href = dataURL;
        link.click();
      } else if (format === 'pdf') {
        const { jsPDF } = window.jspdf;
        const width = canvas.getWidth();
        const height = canvas.getHeight();
        
        // Setup PDF orientation based on canvas width/height ratio
        const orientation = width > height ? 'landscape' : 'portrait';
        const pdf = new jsPDF({
          orientation: orientation,
          unit: 'px',
          format: [width, height]
        });

        pdf.addImage(dataURL, 'PNG', 0, 0, width, height);
        pdf.save('business-card-hd.pdf');
      }
    }
  </script>
</body>
</html>
