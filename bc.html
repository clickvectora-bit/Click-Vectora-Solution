<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Vectora Studio - Interactive Card Generator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    :root {
      --brand-cyan: #00a8b5;
      --brand-blue: #0077c8;
      --brand-orange: #f37021;
      --brand-dark: #2b2e34;
      --bg-light: #f4f8fa;
      --card-bg: #ffffff;
      --border-color: #d1e5e8;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg-light); margin: 0; padding: 20px; color: var(--brand-dark); }
    
    .brand-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
    .brand-header h2 { margin: 0; color: var(--brand-dark); font-size: 22px; font-weight: 800; }
    .brand-header span { color: var(--brand-cyan); font-weight: 600; font-size: 13px; }

    .wrapper { display: flex; gap: 24px; justify-content: center; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; }
    
    .controls {
      background: var(--card-bg); padding: 20px; border-radius: 12px;
      border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0, 168, 181, 0.08); width: 380px; max-height: 88vh; overflow-y: auto;
    }

    .section-title {
      font-size: 12px; font-weight: 700; color: var(--brand-cyan); text-transform: uppercase;
      margin: 16px 0 8px 0; border-bottom: 2px solid #e6f6f7; padding-bottom: 4px;
    }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: #5a6578; margin-bottom: 4px; }
    .form-group input, .form-group select { 
      width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); 
      background: #fff; color: var(--brand-dark); border-radius: 6px; font-size: 13px; outline: none;
    }

    .color-pickers { display: flex; gap: 10px; }
    .color-pickers div { flex: 1; }
    .color-pickers input[type="color"] { height: 35px; cursor: pointer; padding: 2px; }

    .preview-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    
    .toggle-buttons { display: flex; background: #e6f6f7; padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); }
    .toggle-buttons button { border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; background: transparent; color: #5a6578; }
    .toggle-buttons button.active { background: var(--brand-cyan); color: #ffffff; }

    /* Interactive Card Box */
    .card-box {
      width: 350px; height: 200px; border-radius: 10px; padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); position: relative;
      overflow: hidden; background-color: #ffffff; color: var(--brand-dark);
      border-left: 6px solid var(--brand-cyan); user-select: none;
    }

    /* Editable Text Item */
    .editable-text {
      outline: none; cursor: move; position: absolute; padding: 2px 4px; border: 1px dashed transparent;
    }
    .editable-text:hover, .editable-text:focus { border-color: var(--brand-cyan); }

    /* Movable Logo Container */
    .movable-logo {
      position: absolute; top: 15px; left: 15px; cursor: move; display: inline-block;
    }
    .movable-logo img { max-height: 40px; display: block; }

    #qrcode { position: absolute; bottom: 15px; right: 15px; background: white; padding: 4px; border-radius: 6px; border: 1px solid var(--border-color); }

    .action-buttons { display: flex; gap: 10px; width: 100%; }
    .btn-pay { background: var(--brand-orange); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; flex: 1; }
  </style>
</head>
<body>

  <div class="brand-header">
    <h2>CLICK VECTORA STUDIO</h2>
    <span>Interactive Business Card Creator</span>
  </div>

  <div class="wrapper">
    <div class="controls">
      <div class="section-title">1. Upload Logo & Scale</div>
      <div class="form-group">
        <label>Upload Logo</label>
        <input type="file" id="logoInput" accept="image/*" onchange="handleLogoUpload(event)">
      </div>
      <div class="form-group">
        <label>Logo Size (Manual Scale)</label>
        <input type="range" id="logoScale" min="20" max="100" value="40" oninput="scaleLogo(this.value)">
      </div>

      <div class="section-title">2. Live Colors & Typography</div>
      <div class="color-pickers form-group">
        <div>
          <label>Name Color</label>
          <input type="color" id="nameColor" value="#2b2e34" onchange="changeColor('cardName', this.value)">
        </div>
        <div>
          <label>Title Color</label>
          <input type="color" id="titleColor" value="#00a8b5" onchange="changeColor('cardTitle', this.value)">
        </div>
        <div>
          <label>Contact Color</label>
          <input type="color" id="contactColor" value="#2b2e34" onchange="changeColor('cardContacts', this.value)">
        </div>
      </div>

      <div class="section-title">3. Quick Fill Details</div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="inputName" value="Rahul Sharma" oninput="updateText('cardName', this.value)">
      </div>
      <div class="form-group">
        <label>Designation</label>
        <input type="text" id="inputTitle" value="Lead Graphic Designer" oninput="updateText('cardTitle', this.value)">
      </div>
      <div class="form-group">
        <label>Phone & Email</label>
        <input type="text" id="inputPhone" value="📞 +91 98765 43210" oninput="updateText('cardPhone', this.value)">
        <input type="text" id="inputEmail" value="✉️ rahul@clickvectora.com" style="margin-top:5px;" oninput="updateText('cardEmail', this.value)">
      </div>
    </div>

    <div class="preview-container">
      <div id="cardCanvas" class="card-box">
        <div id="logoWrapper" class="movable-logo" style="top: 15px; left: 15px;">
          <img id="cardLogo" src="1000231418.png" alt="Logo">
        </div>

        <div id="cardName" class="editable-text" contenteditable="true" style="top: 65px; left: 15px; font-size: 18px; font-weight: bold; color: var(--brand-dark);">Rahul Sharma</div>
        <div id="cardTitle" class="editable-text" contenteditable="true" style="top: 92px; left: 15px; font-size: 11px; font-weight: 600; color: var(--brand-cyan);">Lead Graphic Designer</div>
        
        <div id="cardContacts" style="position: absolute; bottom: 15px; left: 15px; font-size: 11px; line-height: 1.6;">
          <div id="cardPhone" class="editable-text" contenteditable="true" style="position:relative;">📞 +91 98765 43210</div>
          <div id="cardEmail" class="editable-text" contenteditable="true" style="position:relative;">✉️ rahul@clickvectora.com</div>
        </div>

        <div id="qrcode"></div>
      </div>

      <div class="action-buttons">
        <button class="btn-pay" onclick="payAndDownload('png')">Pay ₹99 & Download PNG</button>
        <button class="btn-pay" style="background:var(--brand-blue);" onclick="payAndDownload('pdf')">Pay ₹99 & Download PDF</button>
      </div>
    </div>
  </div>

  <script>
    window.onload = function() {
      new QRCode(document.getElementById("qrcode"), {
        width: 45, height: 45, colorDark : "#00a8b5", colorLight : "#ffffff"
      });
      makeElementDraggable(document.getElementById("logoWrapper"));
    };

    function handleLogoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('cardLogo').src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function scaleLogo(size) {
      document.getElementById('cardLogo').style.maxHeight = size + 'px';
    }

    function changeColor(elementId, color) {
      document.getElementById(elementId).style.color = color;
    }

    function updateText(elementId, val) {
      document.getElementById(elementId).innerText = val;
    }

    // Drag and Drop Logic for Elements on Canvas
    function makeElementDraggable(elmnt) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      elmnt.onmousedown = dragMouseDown;

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmousemove = null;
        document.onmouseup = null;
      }
    }

    function payAndDownload(format) {
      const card = document.getElementById('cardCanvas');
      html2canvas(card, { scale: 3 }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        if (format === 'png') {
          const link = document.createElement('a');
          link.download = `click-vectora-card.png`;
          link.href = imgData;
          link.click();
        } else {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: 'landscape', unit: 'in', format: [3.5, 2] });
          pdf.addImage(imgData, 'PNG', 0, 0, 3.5, 2);
          pdf.save(`click-vectora-card.pdf`);
        }
      });
    }
  </script>
</body>
</html>
