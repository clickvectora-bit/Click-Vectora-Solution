<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Business Card Studio - Pro Mobile & Desktop</title>
  
  <!-- Fabric.js, QR Code, jsPDF & Razorpay SDKs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #FF6B00;
      --primary-hover: #E05D00;
      --bg-workspace: #F1F5F9;
      --border-color: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; touch-action: manipulation; }
    body { display: flex; height: 100vh; background: var(--bg-workspace); color: var(--text-main); overflow: hidden; flex-direction: row; }

    /* Desktop Sidebar */
    .sidebar {
      width: 360px;
      background: #FFFFFF;
      border-right: 1px solid var(--border-color);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #FFF1E6;
      padding-bottom: 10px;
    }

    .section-title { font-weight: 600; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      font-size: 0.82rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #FFF; color: var(--text-main); border: 1px solid var(--border-color); }
    button.secondary:hover { background: #F8FAFC; border-color: #CBD5E1; }
    button.danger { background: #EF4444; }
    button.danger:hover { background: #DC2626; }

    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      font-size: 0.82rem;
      background: #FAFAFA;
    }
    input:focus, select:focus { border-color: var(--primary); background: #FFF; }

    /* Workspace & Responsive Canvas Styling */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 10px;
      background: radial-gradient(#CBD5E1 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .canvas-container-wrapper {
      background: #FFFFFF;
      border-radius: 4px;
      box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.15), 0 0 0 1px rgba(0,0,0,0.05);
      transition: border-radius 0.3s ease, transform 0.2s ease;
      position: relative;
    }

    .canvas-container-wrapper.rounded {
      border-radius: 16px;
      overflow: hidden;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      padding: 24px;
      border-radius: 12px;
      width: 360px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .modal h3 { margin-bottom: 8px; color: var(--text-main); }
    .modal p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
    .price-tag { font-size: 2rem; font-weight: 700; color: var(--primary); margin: 8px 0; }

    #qrcode-hidden { display: none; }

    /* Mobile Responsive Custom Styling */
    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      .sidebar {
        width: 100%;
        height: 50vh;
        border-right: none;
        border-top: 1px solid var(--border-color);
        box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
      }
      .workspace {
        height: 50vh;
        padding: 5px;
      }
    }
  </style>
</head>
<body>

  <!-- Controls Sidebar -->
  <div class="sidebar">
    <div class="brand">✨ Studio Pro</div>

    <!-- Canvas Layout Controls -->
    <div>
      <div class="section-title">Card Orientation & Shape</div>
      <div class="btn-group" style="margin-top: 6px;">
        <button onclick="setOrientation('horizontal')">Horizontal</button>
        <button onclick="setOrientation('vertical')">Vertical</button>
        <button class="secondary" onclick="toggleRounded()">Toggle Radius</button>
      </div>
    </div>

    <!-- Text Formatting -->
    <div>
      <div class="section-title">Text Tools</div>
      <button style="width: 100%; margin-top: 6px; margin-bottom: 8px;" onclick="addText()">+ Add Text Layer</button>
      
      <div style="display: flex; gap: 6px; margin-bottom: 6px;">
        <input type="color" id="textColor" onchange="updateTextProperty('fill', this.value)" value="#0F172A" style="height: 36px; width: 44px; cursor: pointer; padding: 2px;">
        <select id="fontFamily" onchange="updateTextProperty('fontFamily', this.value)">
          <option value="Poppins">Poppins</option>
          <option value="Montserrat">Montserrat</option>
          <option value="Roboto">Roboto</option>
          <option value="Arial">Arial</option>
        </select>
      </div>

      <div class="btn-group">
        <button class="secondary" style="flex:1;" onclick="toggleStyle('bold')"><b>B</b></button>
        <button class="secondary" style="flex:1;" onclick="toggleStyle('italic')"><i>I</i></button>
        <button class="secondary" style="flex:1;" onclick="toggleStyle('underline')"><u>U</u></button>
      </div>
    </div>

    <!-- Image Upload -->
    <div>
      <div class="section-title">Upload Logo / Image</div>
      <input type="file" id="imageLoader" accept="image/*" style="margin-top: 6px;">
    </div>

    <!-- QR Code Generator -->
    <div>
      <div class="section-title">QR Code Generator</div>
      <input type="text" id="qrInput" placeholder="URL / UPI / Contact" style="margin-top: 6px; margin-bottom: 6px;">
      <button style="width: 100%;" onclick="addQRCode()">Generate QR Code</button>
    </div>

    <!-- Shapes & Accents -->
    <div>
      <div class="section-title">Shapes & Accents</div>
      <div class="btn-group" style="margin-top: 6px;">
        <button class="secondary" onclick="addShape('rect')">Rectangle</button>
        <button class="secondary" onclick="addShape('circle')">Circle</button>
        <button class="secondary" onclick="addShape('triangle')">Triangle</button>
        <button class="secondary" onclick="addShape('line')">Line</button>
      </div>
    </div>

    <!-- Export & Controls -->
    <div style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 10px;">
      <button class="danger" style="width: 100%; margin-bottom: 8px;" onclick="deleteSelected()">Delete Selected</button>
      
      <div class="section-title" style="margin-bottom: 6px;">Export Options</div>
      <div style="display: flex; gap: 6px;">
        <button style="flex: 1; background: #10B981;" onclick="initiatePayment('png')">Download PNG</button>
        <button style="flex: 1; background: #2563EB;" onclick="initiatePayment('pdf')">Download PDF</button>
      </div>
    </div>
  </div>

  <!-- Workspace & Canvas Container -->
  <div class="workspace" id="workspace">
    <div class="canvas-container-wrapper" id="canvasWrapper">
      <canvas id="cardCanvas"></canvas>
    </div>
  </div>

  <!-- Payment Gateway Modal -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal">
      <h3>Unlock HD Download</h3>
      <p>Download print-ready vector file for your card.</p>
      <div class="price-tag">₹49</div>
      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <button class="secondary" style="flex:1;" onclick="closeModal()">Cancel</button>
        <button style="flex:1;" onclick="processRazorpay()">Pay with Razorpay</button>
      </div>
    </div>
  </div>

  <div id="qrcode-hidden"></div>

  <script>
    // Initialize Fabric Canvas
    let canvas = new fabric.Canvas('cardCanvas', {
      backgroundColor: '#ffffff',
      preserveObjectStacking: true,
      allowTouchScrolling: false // Fixes Mobile touch conflicts
    });

    let isRounded = false;
    let selectedExportType = 'png';
    let currentOrientation = 'horizontal';

    // Base Design Dimensions (Standard Ratio 3.5:2 @ 150 DPI)
    const BASE_WIDTH = 525;
    const BASE_HEIGHT = 300;

    // Mobile & Desktop Dynamic Rescaling Engine
    function resizeCanvasToFitContainer() {
      const workspace = document.getElementById('workspace');
      const maxWidth = workspace.clientWidth - 20;
      const maxHeight = workspace.clientHeight - 20;

      let targetW = currentOrientation === 'horizontal' ? BASE_WIDTH : BASE_HEIGHT;
      let targetH = currentOrientation === 'horizontal' ? BASE_HEIGHT : BASE_WIDTH;

      let scale = Math.min(maxWidth / targetW, maxHeight / targetH, 1);

      canvas.setDimensions({
        width: targetW * scale,
        height: targetH * scale
      });

      canvas.setZoom(scale);
      canvas.renderAll();
    }

    function setOrientation(type) {
      currentOrientation = type;
      resizeCanvasToFitContainer();
    }

    window.addEventListener('resize', resizeCanvasToFitContainer);
    setTimeout(resizeCanvasToFitContainer, 100);

    function toggleRounded() {
      const wrapper = document.getElementById('canvasWrapper');
      isRounded = !isRounded;
      wrapper.classList.toggle('rounded', isRounded);
    }

    // Modern Layer Corner Controls (Professional Canvas Look)
    fabric.Object.prototype.set({
      transparentCorners: false,
      cornerColor: '#FF6B00',
      cornerStrokeColor: '#FFFFFF',
      borderColor: '#FF6B00',
      cornerSize: 10,
      cornerStyle: 'circle',
      borderDashArray: [4, 4]
    });

    // Add Text Layer
    function addText() {
      const text = new fabric.IText('Your Name / Title', {
        left: 40,
        top: 40,
        fontFamily: 'Poppins',
        fill: '#0F172A',
        fontSize: 18
      });
      canvas.add(text);
      canvas.setActiveObject(text);
    }

    function updateTextProperty(prop, value) {
      const activeObject = canvas.getActiveObject();
      if (activeObject && activeObject.isType('i-text')) {
        activeObject.set(prop, value);
        canvas.renderAll();
      }
    }

    function toggleStyle(style) {
      const activeObject = canvas.getActiveObject();
      if (activeObject && activeObject.isType('i-text')) {
        if (style === 'bold') activeObject.set('fontWeight', activeObject.fontWeight === 'bold' ? 'normal' : 'bold');
        if (style === 'italic') activeObject.set('fontStyle', activeObject.fontStyle === 'italic' ? 'normal' : 'italic');
        if (style === 'underline') activeObject.set('underline', !activeObject.underline);
        canvas.renderAll();
      }
    }

    // Image Upload
    document.getElementById('imageLoader').addEventListener('change', function (e) {
      const reader = new FileReader();
      reader.onload = function (event) {
        fabric.Image.fromURL(event.target.result, function (img) {
          img.scaleToWidth(100);
          canvas.add(img);
          canvas.setActiveObject(img);
        });
      };
      if (e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    });

    // QR Code Generator
    function addQRCode() {
      const text = document.getElementById('qrInput').value.trim();
      if (!text) return alert('Please enter text/URL');

      const qrContainer = document.getElementById('qrcode-hidden');
      qrContainer.innerHTML = '';

      new QRCode(qrContainer, { text: text, width: 120, height: 120 });

      setTimeout(() => {
        const imgTag = qrContainer.querySelector('img');
        if (imgTag) {
          fabric.Image.fromURL(imgTag.src, function (img) {
            img.scaleToWidth(80);
            img.set({ left: 50, top: 50 });
            canvas.add(img);
            canvas.setActiveObject(img);
          });
        }
      }, 100);
    }

    // Shape Drawing
    function addShape(type) {
      let shape;
      if (type === 'rect') shape = new fabric.Rect({ width: 80, height: 50, fill: '#FF6B00', left: 50, top: 50 });
      else if (type === 'circle') shape = new fabric.Circle({ radius: 30, fill: '#FF6B00', left: 50, top: 50 });
      else if (type === 'triangle') shape = new fabric.Triangle({ width: 60, height: 60, fill: '#FF6B00', left: 50, top: 50 });
      else if (type === 'line') shape = new fabric.Line([40, 50, 160, 50], { stroke: '#FF6B00', strokeWidth: 3 });

      canvas.add(shape);
      canvas.setActiveObject(shape);
    }

    function deleteSelected() {
      const activeObjects = canvas.getActiveObjects();
      if (activeObjects.length) {
        activeObjects.forEach(obj => canvas.remove(obj));
        canvas.discardActiveObject();
      }
    }

    // Razorpay Flow
    function initiatePayment(type) {
      selectedExportType = type;
      document.getElementById('paymentModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('paymentModal').style.display = 'none';
    }

    function processRazorpay() {
      closeModal();
      var options = {
        "key": "YOUR_RAZORPAY_KEY_ID",
        "amount": 4900,
        "currency": "INR",
        "name": "Business Card Studio",
        "description": "HD Export Payment",
        "handler": function (response) {
          alert("Payment Successful! Generating export...");
          downloadCard(selectedExportType);
        },
        "theme": { "color": "#FF6B00" }
      };
      var rzp1 = new Razorpay(options);
      rzp1.open();
    }

    // Export Handler Engine
    function downloadCard(format) {
      // Export at original resolution ignoring zoom scaling
      const dataURL = canvas.toDataURL({
        format: 'png',
        quality: 1.0,
        multiplier: 3 / canvas.getZoom()
      });

      if (format === 'png') {
        const link = document.createElement('a');
        link.download = 'business-card-hd.png';
        link.href = dataURL;
        link.click();
      } else if (format === 'pdf') {
        const { jsPDF } = window.jspdf;
        const w = currentOrientation === 'horizontal' ? BASE_WIDTH : BASE_HEIGHT;
        const h = currentOrientation === 'horizontal' ? BASE_HEIGHT : BASE_WIDTH;
        
        const pdf = new jsPDF({
          orientation: currentOrientation === 'horizontal' ? 'landscape' : 'portrait',
          unit: 'px',
          format: [w, h]
        });

        pdf.addImage(dataURL, 'PNG', 0, 0, w, h);
        pdf.save('business-card-hd.pdf');
      }
    }
  </script>
</body>
</html>
