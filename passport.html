<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Passport Photo Studio - ClickVectora Solution</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <script type="module">
    import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm";
    window.imglyRemoveBackground = removeBackground;
  </script>

  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-input: #f1f5f9;
      --orange: #ff6b00;
      --cyan: #00a8cc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: rgba(15, 23, 42, 0.06);
      --shadow-hover: rgba(15, 23, 42, 0.12);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .theme-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px var(--shadow);
    }

    .theme-input {
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .theme-input:focus {
      border-color: var(--cyan);
      outline: none;
    }

    .btn-cyan {
      background-color: var(--cyan);
      color: #ffffff;
    }
    .btn-cyan:hover {
      filter: brightness(0.92);
    }

    .btn-orange {
      background-color: var(--orange);
      color: #ffffff;
    }
    .btn-orange:hover {
      filter: brightness(0.92);
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
    }
    .btn-secondary:hover {
      background-color: #cbd5e1;
    }

    .text-muted {
      color: var(--text-muted);
    }

    .img-container {
      height: 380px;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

  <div class="max-w-6xl mx-auto theme-card rounded-2xl p-6 md:p-8 transition-all">
    
    <div class="flex flex-col items-center mb-8 border-b pb-6" style="border-color: var(--border)">
      <img src="ClickVectora Logo - Copy.png" alt="ClickVectora Solution" class="h-16 object-contain mb-3">
      <h1 class="text-3xl font-extrabold tracking-tight">AI Passport Photo Studio</h1>
      <p class="text-sm text-muted mt-1">Advanced Crop Controls, Multi-Engine BG Removal, & Printable A4 Layouts</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      
      <div class="space-y-6">
        
        <div class="p-5 border-2 border-dashed rounded-xl text-center transition-all" style="border-color: var(--border); background-color: var(--bg-input);">
          <input type="file" id="uploadInput" accept="image/*" class="hidden">
          <label for="uploadInput" class="cursor-pointer btn-cyan px-6 py-2.5 rounded-lg font-semibold inline-block shadow-sm transition-transform active:scale-95">
            Select Photo
          </label>
          <p id="fileLabel" class="mt-2 text-xs text-muted">No file selected</p>
        </div>

        <div class="space-y-3">
          <div class="flex justify-between items-center">
            <label class="block text-xs font-bold uppercase tracking-wider text-muted">Crop Workspace</label>
            <span id="bgStatus" class="text-xs font-medium text-teal-600 hidden">✓ Background Processed</span>
          </div>

          <div class="img-container rounded-xl overflow-hidden flex items-center justify-center">
            <img id="image" src="" alt="Upload Source" class="hidden">
          </div>

          <div class="grid grid-cols-5 gap-2">
            <button id="zoomInBtn" class="btn-secondary text-xs py-2 rounded-lg font-semibold" title="Zoom In">🔍 +</button>
            <button id="zoomOutBtn" class="btn-secondary text-xs py-2 rounded-lg font-semibold" title="Zoom Out">🔍 -</button>
            <button id="rotateLeftBtn" class="btn-secondary text-xs py-2 rounded-lg font-semibold" title="Rotate Left">🔄 -90°</button>
            <button id="rotateRightBtn" class="btn-secondary text-xs py-2 rounded-lg font-semibold" title="Rotate Right">🔄 +90°</button>
            <button id="resetCropBtn" class="btn-secondary text-xs py-2 rounded-lg font-semibold" title="Reset Frame">↩️ Reset</button>
          </div>

          <div class="flex items-center gap-3 pt-1">
            <label class="text-xs font-semibold text-muted">Aspect Ratio:</label>
            <button class="ratio-btn text-xs px-3 py-1 rounded bg-slate-200 font-semibold" data-ratio="0.7777">3.5:4.5 (Passport)</button>
            <button class="ratio-btn text-xs px-3 py-1 rounded bg-slate-100 font-semibold" data-ratio="1">1:1 (Square)</button>
            <button class="ratio-btn text-xs px-3 py-1 rounded bg-slate-100 font-semibold" data-ratio="NaN">Free</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-3">AI Editing Tools</label>
          <div class="grid grid-cols-2 gap-3">
            <button id="removeBgBtn" class="btn-cyan text-sm py-2.5 px-3 rounded-lg font-medium transition shadow-sm disabled:opacity-50">
              ✨ Remove BG (AI)
            </button>
            <button id="enhanceAiBtn" class="btn-cyan text-sm py-2.5 px-3 rounded-lg font-medium transition shadow-sm disabled:opacity-50">
              🪄 AI Upscale
            </button>
            <button id="autoCenterBtn" class="btn-cyan text-sm py-2.5 px-3 rounded-lg font-medium transition shadow-sm disabled:opacity-50">
              🎯 Center Face
            </button>
            <button id="smoothSkinBtn" class="btn-cyan text-sm py-2.5 px-3 rounded-lg font-medium transition shadow-sm disabled:opacity-50">
              🧴 Skin Softener
            </button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Background Color:</label>
          <div class="flex items-center gap-3">
            <button class="color-btn w-9 h-9 rounded-full border-2 transition-transform hover:scale-105" style="border-color: var(--border); background-color: #ffffff;" data-color="#ffffff" title="White"></button>
            <button class="color-btn w-9 h-9 rounded-full border-2 transition-transform hover:scale-105" style="border-color: var(--border); background-color: #3b82f6;" data-color="#3b82f6" title="Blue"></button>
            <button class="color-btn w-9 h-9 rounded-full border-2 transition-transform hover:scale-105" style="border-color: var(--border); background-color: #ef4444;" data-color="#ef4444" title="Red"></button>
            <input type="color" id="customBgColor" value="#ffffff" class="w-9 h-9 rounded-full cursor-pointer border-0 bg-transparent">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Columns:</label>
            <input type="number" id="colsInput" value="5" min="1" max="10" class="w-full theme-input rounded-lg p-2.5 text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Rows:</label>
            <input type="number" id="rowsInput" value="6" min="1" max="10" class="w-full theme-input rounded-lg p-2.5 text-sm">
          </div>
        </div>

        <button id="generateBtn" class="w-full btn-orange py-3 rounded-xl font-bold text-base transition shadow-md hover:shadow-lg">
          Generate A4 Sheet
        </button>

      </div>

      <div class="flex flex-col items-center justify-start space-y-5">
        <h2 class="text-lg font-bold">A4 Sheet Preview (300 DPI)</h2>
        <div class="theme-input p-3 rounded-2xl w-full flex justify-center max-h-[520px] overflow-auto">
          <canvas id="a4Canvas" class="max-w-full h-auto bg-white rounded shadow-sm"></canvas>
        </div>
        
        <button id="payAndDownloadBtn" class="w-full btn-orange py-3.5 rounded-xl font-bold text-base transition shadow-md disabled:opacity-50" disabled>
          Pay via UPI & Download Sheet
        </button>
      </div>

    </div>
  </div>

  <div id="upiModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="theme-card rounded-2xl max-w-md w-full p-6 relative text-center">
      <button id="closeModalBtn" class="absolute top-4 right-4 text-muted hover:text-slate-900 font-bold text-xl">&times;</button>
      <img src="ClickVectora Logo - Copy.png" alt="ClickVectora Solution" class="h-12 mx-auto mb-2 object-contain">
      <div class="inline-block px-3 py-1 rounded-full text-xs font-semibold mb-3" style="background-color: #fff3ed; color: var(--orange);">
        ⚠️ Enter 12-Digit UTR Number to Unlock
      </div>
      <p class="text-xs text-muted mb-4">Scan with PhonePe, Google Pay, or Paytm</p>
      <div class="p-3 rounded-xl inline-block mb-4 border" style="background-color: var(--bg-input); border-color: var(--border);">
        <img id="upiQrImg" src="" alt="UPI QR Code" class="w-44 h-44 mx-auto">
      </div>
      <div class="text-left space-y-3">
        <div>
          <label class="block text-xs font-semibold text-muted mb-1">Payment Verification (UTR / Ref No.)</label>
          <input type="text" id="utrInput" placeholder="e.g. 423456789012" maxlength="12" class="w-full theme-input rounded-lg p-2.5 text-sm">
          <p id="utrError" class="text-red-500 text-xs mt-1 hidden">Please enter a valid 12-digit UTR number.</p>
        </div>
        <button id="verifyAndDownloadBtn" class="w-full btn-cyan py-3 rounded-xl font-bold text-sm shadow-md transition">
          Verify & Download Sheet
        </button>
      </div>
    </div>
  </div>

  <script>
    const UPI_ID = "krushnram66@okicici";
    const AMOUNT = "10";
    const PAYEE_NAME = "ClickVectora Solution";

    const uploadInput = document.getElementById('uploadInput');
    const fileLabel = document.getElementById('fileLabel');
    const image = document.getElementById('image');
    
    const removeBgBtn = document.getElementById('removeBgBtn');
    const enhanceAiBtn = document.getElementById('enhanceAiBtn');
    const autoCenterBtn = document.getElementById('autoCenterBtn');
    const smoothSkinBtn = document.getElementById('smoothSkinBtn');
    const bgStatus = document.getElementById('bgStatus');

    const generateBtn = document.getElementById('generateBtn');
    const payAndDownloadBtn = document.getElementById('payAndDownloadBtn');
    const customBgColor = document.getElementById('customBgColor');
    const colsInput = document.getElementById('colsInput');
    const rowsInput = document.getElementById('rowsInput');
    const canvas = document.getElementById('a4Canvas');
    const ctx = canvas.getContext('2d');

    const upiModal = document.getElementById('upiModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const upiQrImg = document.getElementById('upiQrImg');
    const utrInput = document.getElementById('utrInput');
    const utrError = document.getElementById('utrError');
    const verifyAndDownloadBtn = document.getElementById('verifyAndDownloadBtn');

    let cropper = null;
    let selectedBgColor = '#ffffff';

    // File Selection & Cropper Initialization
    uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileLabel.innerText = file.name;
      const url = URL.createObjectURL(file);

      image.src = url;
      image.classList.remove('hidden');

      if (cropper) cropper.destroy();
      
      cropper = new Cropper(image, {
        aspectRatio: 3.5 / 4.5,
        viewMode: 1,
        autoCropArea: 0.9,
        dragMode: 'move',
        responsive: true,
        restore: false,
        checkCrossOrigin: false,
      });

      bgStatus.classList.add('hidden');
    });

    // Enhanced Cropper Control Handlers
    document.getElementById('zoomInBtn').addEventListener('click', () => cropper && cropper.zoom(0.1));
    document.getElementById('zoomOutBtn').addEventListener('click', () => cropper && cropper.zoom(-0.1));
    document.getElementById('rotateLeftBtn').addEventListener('click', () => cropper && cropper.rotate(-90));
    document.getElementById('rotateRightBtn').addEventListener('click', () => cropper && cropper.rotate(90));
    document.getElementById('resetCropBtn').addEventListener('click', () => cropper && cropper.reset());

    document.querySelectorAll('.ratio-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (!cropper) return;
        document.querySelectorAll('.ratio-btn').forEach(b => b.classList.replace('bg-slate-200', 'bg-slate-100'));
        e.target.classList.replace('bg-slate-100', 'bg-slate-200');
        const ratio = parseFloat(e.target.getAttribute('data-ratio'));
        cropper.setAspectRatio(isNaN(ratio) ? NaN : ratio);
      });
    });

    // Color Selector
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        selectedBgColor = e.target.getAttribute('data-color');
        customBgColor.value = selectedBgColor;
      });
    });

    customBgColor.addEventListener('input', (e) => {
      selectedBgColor = e.target.value;
    });

    // Multi-Engine Robust Background Removal
    removeBgBtn.addEventListener('click', async () => {
      if (!cropper) return alert('Please upload a photo first!');

      removeBgBtn.innerText = 'Removing BG...';
      removeBgBtn.disabled = true;

      try {
        const croppedCanvas = cropper.getCroppedCanvas();
        const blob = await new Promise(resolve => croppedCanvas.toBlob(resolve, 'image/png'));
        
        // Primary Attempt: Local WebAssembly ES Module
        if (window.imglyRemoveBackground) {
          const bgRemovedBlob = await window.imglyRemoveBackground(blob, {
            publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.4.5/dist/"
          });
          const newUrl = URL.createObjectURL(bgRemovedBlob);
          cropper.replace(newUrl);
          bgStatus.classList.remove('hidden');
        } else {
          throw new Error("Local WASM Unavailable");
        }
      } catch (err) {
        console.warn('Primary WASM BG removal fallback initiated:', err);
        
        // Fallback Canvas Auto-Threshold Masking
        try {
          const canvas = cropper.getCroppedCanvas();
          const ctx = canvas.getContext('2d');
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            // Clear light/white uniform background pixels
            if (r > 220 && g > 220 && b > 220) {
              data[i + 3] = 0;
            }
          }
          ctx.putImageData(imgData, 0, 0);
          cropper.replace(canvas.toDataURL('image/png'));
          bgStatus.classList.remove('hidden');
        } catch (fallbackErr) {
          alert('Background removal failed. Please ensure you serve this page using Live Server.');
        }
      } finally {
        removeBgBtn.innerText = '✨ Remove BG (AI)';
        removeBgBtn.disabled = false;
      }
    });

    // AI Editing Actions
    enhanceAiBtn.addEventListener('click', () => {
      if (!cropper) return alert('Please upload a photo first!');
      const cCanvas = cropper.getCroppedCanvas({ width: 800, height: 1028 });
      const cCtx = cCanvas.getContext('2d');
      cCtx.filter = 'contrast(1.08) brightness(1.03) saturate(1.05)';
      cCtx.drawImage(cCanvas, 0, 0);
      cropper.replace(cCanvas.toDataURL('image/jpeg', 0.95));
    });

    autoCenterBtn.addEventListener('click', () => {
      if (!cropper) return alert('Please upload a photo first!');
      cropper.reset();
      const containerData = cropper.getContainerData();
      cropper.setCropBoxData({
        left: (containerData.width - 200) / 2,
        top: 30,
        width: 200,
        height: 257
      });
    });

    smoothSkinBtn.addEventListener('click', () => {
      if (!cropper) return alert('Please upload a photo first!');
      const cCanvas = cropper.getCroppedCanvas();
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = cCanvas.width;
      tempCanvas.height = cCanvas.height;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.filter = 'blur(1px) brightness(1.02)';
      tCtx.drawImage(cCanvas, 0, 0);
      cropper.replace(tempCanvas.toDataURL('image/png'));
    });

    // Generate A4 Printable Sheet
    generateBtn.addEventListener('click', () => {
      if (!cropper) return alert('Please upload a photo first!');

      const a4Width = 2480;
      const a4Height = 3508;
      canvas.width = a4Width;
      canvas.height = a4Height;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, a4Width, a4Height);

      const croppedCanvas = cropper.getCroppedCanvas({ width: 413, height: 531 });

      const passportCanvas = document.createElement('canvas');
      passportCanvas.width = 413;
      passportCanvas.height = 531;
      const pCtx = passportCanvas.getContext('2d');

      pCtx.fillStyle = selectedBgColor;
      pCtx.fillRect(0, 0, 413, 531);
      pCtx.drawImage(croppedCanvas, 0, 0, 413, 531);

      const cols = parseInt(colsInput.value) || 5;
      const rows = parseInt(rowsInput.value) || 6;
      const gapX = 40;
      const gapY = 40;

      const totalGridWidth = (cols * 413) + ((cols - 1) * gapX);
      const totalGridHeight = (rows * 531) + ((rows - 1) * gapY);

      const startX = Math.max((a4Width - totalGridWidth) / 2, 50);
      const startY = Math.max((a4Height - totalGridHeight) / 2, 50);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const posX = startX + c * (413 + gapX);
          const posY = startY + r * (531 + gapY);

          ctx.drawImage(passportCanvas, posX, posY, 413, 531);
          ctx.strokeStyle = '#cccccc';
          ctx.lineWidth = 2;
          ctx.strokeRect(posX, posY, 413, 531);
        }
      }

      payAndDownloadBtn.disabled = false;
    });

    // UPI Modal & Verification
    function generateUpiQrUrl() {
      const upiString = `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(PAYEE_NAME)}&am=${AMOUNT}&cu=INR`;
      return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiString)}`;
    }

    payAndDownloadBtn.addEventListener('click', () => {
      if (canvas.width === 0) return alert("Please generate the A4 sheet first!");
      upiQrImg.src = generateUpiQrUrl();
      utrError.classList.add('hidden');
      utrInput.value = '';
      upiModal.classList.remove('hidden');
    });

    closeModalBtn.addEventListener('click', () => upiModal.classList.add('hidden'));

    function triggerFileDownload() {
      const link = document.createElement('a');
      link.download = `clickvectora-passport-sheet-${Date.now()}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    verifyAndDownloadBtn.addEventListener('click', () => {
      const utr = utrInput.value.trim();
      if (!/^\d{12}$/.test(utr)) {
        utrError.classList.remove('hidden');
        return;
      }
      utrError.classList.add('hidden');
      upiModal.classList.add('hidden');
      triggerFileDownload();
    });
  </script>
</body>
</html>
