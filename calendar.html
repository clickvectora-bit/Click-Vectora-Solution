<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu Design Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .font-heading { font-family: 'Playfair Display', serif; }
        .font-body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 font-body min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-stone-950 border-b border-stone-800 p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-heading font-bold tracking-wide text-amber-500">🍽️ MenuCraft Studio</h1>
        <div class="space-x-3">
            <button onclick="exportPDF()" class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-semibold px-4 py-2 rounded-lg text-sm transition">Export PDF</button>
            <button onclick="exportImage()" class="bg-stone-800 hover:bg-stone-700 text-stone-200 px-4 py-2 rounded-lg text-sm transition">Download PNG</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 max-w-7xl mx-auto w-full">
        
        <!-- Controls Column -->
        <section class="lg:col-span-5 bg-stone-950 border border-stone-800 rounded-xl p-5 space-y-5 overflow-y-auto max-h-[82vh]">
            <h2 class="text-lg font-semibold border-b border-stone-800 pb-2 text-amber-400">Menu Configuration</h2>
            
            <!-- Restaurant Info -->
            <div class="space-y-3">
                <label class="block text-xs uppercase tracking-wider text-stone-400 font-medium">Restaurant Name</label>
                <input type="text" id="inputRestoName" value="The Gourmet Bistro" class="w-full bg-stone-900 border border-stone-800 rounded-lg p-2.5 text-sm focus:border-amber-500 outline-none" oninput="updatePreview()">
                
                <label class="block text-xs uppercase tracking-wider text-stone-400 font-medium">Tagline / Subtitle</label>
                <input type="text" id="inputTagline" value="Fine Dining & Artisan Cocktails" class="w-full bg-stone-900 border border-stone-800 rounded-lg p-2.5 text-sm focus:border-amber-500 outline-none" oninput="updatePreview()">
            </div>

            <!-- Category & Items Editor -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-xs uppercase tracking-wider text-stone-400 font-medium">Menu Items (JSON Format)</label>
                    <button onclick="loadSampleData()" class="text-xs text-amber-500 hover:underline">Load Sample Data</button>
                </div>
                <textarea id="inputItemsJson" rows="8" class="w-full bg-stone-900 border border-stone-800 rounded-lg p-2.5 font-mono text-xs focus:border-amber-500 outline-none" oninput="updatePreview()">[
  {
    "category": "Starters",
    "items": [
      {"name": "Truffle Arancini", "desc": "Crispy risotto balls with wild mushroom and mozzarella.", "price": "$14"},
      {"name": "Pan-Seared Scallops", "desc": "Served with pea puree and crispy pancetta.", "price": "$18"}
    ]
  },
  {
    "category": "Main Course",
    "items": [
      {"name": "Wagyu Ribeye Steak", "desc": "10oz prime cut with roasted garlic butter and asparagus.", "price": "$48"},
      {"name": "Wild Mushroom Risotto", "desc": "Arborio rice, porcini broth, and aged parmesan.", "price": "$26"}
    ]
  }
]</textarea>
            </div>

            <!-- Theme Settings -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-stone-400 font-medium mb-1">Theme Accent</label>
                    <select id="selectTheme" class="w-full bg-stone-900 border border-stone-800 rounded-lg p-2.5 text-sm outline-none" onchange="updatePreview()">
                        <option value="dark">Dark Luxury (Charcoal / Gold)</option>
                        <option value="light">Classic Clean (Ivory / Charcoal)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-stone-400 font-medium mb-1">Currency Symbol</label>
                    <input type="text" id="inputCurrency" value="$" class="w-full bg-stone-900 border border-stone-800 rounded-lg p-2.5 text-sm outline-none" oninput="updatePreview()">
                </div>
            </div>
        </section>

        <!-- Preview Column -->
        <section class="lg:col-span-7 flex justify-center items-start bg-stone-950 border border-stone-800 rounded-xl p-8 overflow-auto">
            <div id="menuCanvas" class="w-[595px] min-h-[842px] bg-stone-900 text-stone-100 p-12 shadow-2xl flex flex-col justify-between border border-stone-800 transition-all duration-300">
                
                <!-- Menu Header -->
                <div class="text-center space-y-2 border-b border-stone-700/50 pb-6">
                    <h2 id="previewRestoName" class="font-heading text-3xl font-bold tracking-wider text-amber-500 uppercase">The Gourmet Bistro</h2>
                    <p id="previewTagline" class="text-xs tracking-widest text-stone-400 uppercase">Fine Dining & Artisan Cocktails</p>
                </div>

                <!-- Menu Body Content -->
                <div id="previewCategories" class="my-8 space-y-6 flex-1">
                    <!-- Dynamic Categories injected via JS -->
                </div>

                <!-- Menu Footer -->
                <div class="text-center pt-6 border-t border-stone-700/50 text-[10px] tracking-widest text-stone-500 uppercase">
                    Please inform your server of any dietary allergies. Taxes as applicable.
                </div>
            </div>
        </section>
    </main>

    <!-- Script Logic -->
    <script>
        function updatePreview() {
            const restoName = document.getElementById('inputRestoName').value;
            const tagline = document.getElementById('inputTagline').value;
            const theme = document.getElementById('selectTheme').value;
            const canvas = document.getElementById('menuCanvas');

            document.getElementById('previewRestoName').innerText = restoName;
            document.getElementById('previewTagline').innerText = tagline;

            // Theme Styling Adjustments
            if (theme === 'light') {
                canvas.className = "w-[595px] min-h-[842px] bg-stone-100 text-stone-900 p-12 shadow-2xl flex flex-col justify-between border border-stone-300 transition-all duration-300";
            } else {
                canvas.className = "w-[595px] min-h-[842px] bg-stone-900 text-stone-100 p-12 shadow-2xl flex flex-col justify-between border border-stone-800 transition-all duration-300";
            }

            try {
                const rawJson = document.getElementById('inputItemsJson').value;
                const categories = JSON.parse(rawJson);
                let htmlContent = '';

                categories.forEach(cat => {
                    htmlContent += `
                        <div class="space-y-3">
                            <h3 class="font-heading text-lg font-semibold text-amber-500 border-b border-stone-700/30 pb-1">${cat.category}</h3>
                            <div class="space-y-3">
                    `;
                    cat.items.forEach(item => {
                        htmlContent += `
                            <div class="flex justify-between items-baseline">
                                <div class="pr-4 max-w-[80%]">
                                    <h4 class="font-medium text-sm tracking-wide">${item.name}</h4>
                                    <p class="text-[11px] text-stone-400 italic">${item.desc}</p>
                                </div>
                                <span class="font-semibold text-sm text-amber-400">${item.price}</span>
                            </div>
                        `;
                    });
                    htmlContent += `</div></div>`;
                });

                document.getElementById('previewCategories').innerHTML = htmlContent;
            } catch (e) {
                document.getElementById('previewCategories').innerHTML = `<p class="text-rose-500 text-xs">Invalid JSON format in configuration panel.</p>`;
            }
        }

        function loadSampleData() {
            const sample = [
                {
                    "category": "Appetizers",
                    "items": [
                        {"name": "Bruschetta al Pomodoro", "desc": "Grilled artisan bread with garlic, fresh tomatoes, and basil.", "price": "$10"},
                        {"name": "Crispy Calamari", "desc": "Served with house-made lemon garlic aioli.", "price": "$15"}
                    ]
                },
                {
                    "category": "Signature Mains",
                    "items": [
                        {"name": "Handmade Pappardelle", "desc": "Slow-cooked beef ragu with shaved parmesan.", "price": "$24"},
                        {"name": "Grilled Sea Bass", "desc": "Served over herb quinoa and lemon butter reduction.", "price": "$32"}
                    ]
                },
                {
                    "category": "Desserts",
                    "items": [
                        {"name": "Classic Tiramisu", "desc": "Layered ladyfingers, espresso, and mascarpone cream.", "price": "$12"},
                        {"name": "Dark Chocolate Lava Cake", "desc": "Warm molten center with vanilla bean gelato.", "price": "$14"}
                    ]
                }
            ];
            document.getElementById('inputItemsJson').value = JSON.stringify(sample, null, 2);
            updatePreview();
        }

        async function exportImage() {
            const canvasElement = document.getElementById('menuCanvas');
            const canvas = await html2canvas(canvasElement, { scale: 2 });
            const link = document.createElement('a');
            link.download = 'menu-design.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        async function exportPDF() {
            const { jsPDF } = window.jspdf;
            const canvasElement = document.getElementById('menuCanvas');
            const canvas = await html2canvas(canvasElement, { scale: 2 });
            const imgData = canvas.toDataURL('image/png');
            
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
            
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save('menu-design.pdf');
        }

        // Initial trigger
        updatePreview();
    </script>
</body>
</html>
